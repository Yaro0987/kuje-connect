<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Businesses - Kuje Connect</title>
    <meta name="description" content="Manage your business listings on Kuje Connect. Add, edit, track performance, and update your businesses in Kuje, FCT Nigeria.">
    <meta name="keywords" content="Kuje Connect, my businesses, business listings, manage business, Kuje businesses, FCT Nigeria business directory">
    <meta name="author" content="Kuje Connect">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="My Businesses - Kuje Connect">
    <meta property="og:description" content="Add, edit, and manage your business listings on Kuje Connect.">
    <meta property="og:image" content="../images/kuje.png">
    <meta property="og:url" content="https://kujeconnect.com/user/my-businesses">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Kuje Connect">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="My Businesses - Kuje Connect">
    <meta name="twitter:description" content="Manage your business listings on Kuje Connect.">
    <meta name="twitter:image" content="../images/kuje.png">
    <link rel="icon" type="image/png" href="../images/kuje.png">
    <link rel="apple-touch-icon" href="../images/kuje.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/user.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .biz-toolbar {
            display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
        }
        .biz-search-box {
            flex: 1; min-width: 200px; position: relative;
        }
        .biz-search-box input {
            width: 100%; padding: 10px 14px 10px 38px; border: 1.5px solid var(--gray-lighter);
            border-radius: var(--radius-sm); font-size: 0.9rem; color: var(--dark);
            font-family: 'Poppins', sans-serif; background: var(--white); transition: border-color 0.2s;
        }
        .biz-search-box input:focus { outline: none; border-color: var(--primary); }
        .biz-search-box i {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: var(--gray-light); font-size: 0.85rem;
        }
        .biz-filter-select {
            padding: 10px 14px; border: 1.5px solid var(--gray-lighter);
            border-radius: var(--radius-sm); font-size: 0.9rem; color: var(--dark);
            font-family: 'Poppins', sans-serif; background: var(--white); cursor: pointer;
        }
        .biz-filter-select:focus { outline: none; border-color: var(--primary); }
        .biz-count {
            font-size: 0.85rem; color: var(--gray); white-space: nowrap;
        }
        .biz-image-thumb {
            width: 52px; height: 52px; border-radius: 12px; overflow: hidden;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
        }
        .biz-image-thumb img {
            width: 100%; height: 100%; object-fit: cover;
        }
        .biz-info { flex: 1; min-width: 0; }
        .biz-info h4 {
            font-size: 0.95rem; font-weight: 600; color: var(--dark);
            margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .biz-meta {
            display: flex; align-items: center; gap: 14px; font-size: 0.83rem;
            color: var(--gray); flex-wrap: wrap;
        }
        .biz-actions { display: flex; gap: 6px; flex-shrink: 0; }

        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 9999; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--white); border-radius: var(--radius); width: 100%;
            max-width: 560px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 24px; border-bottom: 1px solid var(--gray-lighter);
        }
        .modal-header h3 {
            font-size: 1.05rem; font-weight: 600; color: var(--dark);
        }
        .modal-close {
            background: none; border: none; font-size: 1.2rem; color: var(--gray);
            cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all 0.2s;
        }
        .modal-close:hover { background: var(--gray-lighter); color: var(--dark); }
        .modal-body { padding: 24px; }
        .modal-body .form-group { margin-bottom: 16px; }
        .modal-body .form-group label {
            display: block; font-size: 0.85rem; font-weight: 500; color: var(--dark);
            margin-bottom: 6px;
        }
        .modal-body .form-group input,
        .modal-body .form-group select,
        .modal-body .form-group textarea {
            width: 100%; padding: 10px 14px; border: 1.5px solid var(--gray-lighter);
            border-radius: var(--radius-sm); font-size: 0.9rem; color: var(--dark);
            font-family: 'Poppins', sans-serif; background: var(--white); transition: border-color 0.2s;
        }
        .modal-body .form-group input:focus,
        .modal-body .form-group select:focus,
        .modal-body .form-group textarea:focus { outline: none; border-color: var(--primary); }
        .modal-body .form-group textarea { resize: vertical; min-height: 80px; }
        .modal-footer {
            display: flex; justify-content: flex-end; gap: 10px;
            padding: 16px 24px; border-top: 1px solid var(--gray-lighter);
        }
        .empty-state {
            text-align: center; padding: 50px 20px;
        }
        .empty-state i {
            font-size: 3rem; color: var(--gray-light); margin-bottom: 16px; display: block;
        }
        .empty-state h4 { color: var(--gray); margin-bottom: 8px; }
        .empty-state p { color: var(--gray-light); font-size: 0.9rem; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="site-header"></div>

    <div class="user-layout">
        <aside class="user-sidebar">
            <div class="user-sidebar-header">
                <div class="user-avatar">A</div>
                <h4>Amina Ibrahim</h4>
                <span class="user-badge"><i class="fas fa-briefcase"></i> Business Owner</span>
            </div>
            <nav class="user-nav">
                <a href="dashboard" class="user-nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
                <a href="profile" class="user-nav-item"><i class="fas fa-user"></i> My Profile</a>
                <a href="my-businesses" class="user-nav-item active"><i class="fas fa-store"></i> My Businesses</a>
                <a href="messages" class="user-nav-item"><i class="fas fa-envelope"></i> Messages</a>
                <a href="favorites" class="user-nav-item"><i class="fas fa-heart"></i> Favorites</a>
                <a href="notifications" class="user-nav-item"><i class="fas fa-bell"></i> Notifications</a>
                <div class="user-nav-divider"></div>
                <a href="settings" class="user-nav-item"><i class="fas fa-cog"></i> Settings</a>
                <a href="../.." class="user-nav-item"><i class="fas fa-home"></i> Back to Home</a>
                <a href="#" class="user-nav-item logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </nav>
        </aside>

        <main class="user-main" id="bizMain">
            <div class="page-header">
                <div>
                    <h2>My Businesses</h2>
                    <p>Manage your listed businesses.</p>
                </div>
                <a href="add-business" class="btn-sm btn-primary"><i class="fas fa-plus"></i> Add New Business</a>
            </div>

            <div class="biz-toolbar" id="bizToolbar" style="display:none;">
                <div class="biz-search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="bizSearchInput" placeholder="Search businesses by name, category, or location...">
                </div>
                <select class="biz-filter-select" id="bizStatusFilter">
                    <option value="all">All Status</option>
                    <option value="active">Active</option>
                    <option value="pending">Pending</option>
                    <option value="inactive">Inactive</option>
                </select>
                <select class="biz-filter-select" id="bizCategoryFilter">
                    <option value="all">All Categories</option>
                </select>
                <span class="biz-count" id="bizCount"></span>
            </div>

            <div id="bizList"></div>
        </main>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fas fa-pen" style="color:var(--primary);margin-right:8px;"></i> Edit Business</h3>
                <button class="modal-close" id="modalCloseBtn">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editBizId">
                <div class="form-group">
                    <label>Business Name *</label>
                    <input type="text" id="editBizName" placeholder="Business name">
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="editBizCategory"></select>
                </div>
                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="editBizDesc" rows="3" placeholder="Describe your business"></textarea>
                </div>
                <div class="form-group">
                    <label>Address *</label>
                    <input type="text" id="editBizAddress" placeholder="Full address">
                </div>
                <div class="form-group">
                    <label>Location / Area</label>
                    <input type="text" id="editBizLocation" placeholder="e.g. Kuje">
                </div>
                <div class="form-group">
                    <label>Phone *</label>
                    <input type="tel" id="editBizPhone" placeholder="Phone number">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="editBizEmail" placeholder="Email address">
                </div>
                <div class="form-group">
                    <label>Website</label>
                    <input type="url" id="editBizWebsite" placeholder="https://...">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-sm" id="modalCancelBtn">Cancel</button>
                <button class="btn-sm btn-primary" id="modalSaveBtn"><i class="fas fa-check"></i> Save Changes</button>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="../data/data.js"></script>
    <script src="../js/user.js"></script>
    <script src="../js/includes.js"></script>
    <script src="../js/main.js"></script>
    <script>
    (function() {
        var user = getCurrentUser();
        if (!user) return;

        var allBusinesses = [];
        var searchTerm = '';
        var statusFilter = 'all';
        var categoryFilter = 'all';

        function loadBusinesses() {
            allBusinesses = getUserBusinesses(user.id);
            populateCategoryFilter();
            renderBusinesses();
        }

        function populateCategoryFilter() {
            var sel = document.getElementById('bizCategoryFilter');
            if (!sel) return;
            var catSlugs = {};
            allBusinesses.forEach(function(b) {
                if (b.category) catSlugs[b.category] = true;
            });
            sel.innerHTML = '<option value="all">All Categories</option>';
            Object.keys(catSlugs).forEach(function(slug) {
                var cat = DB.categories.find(function(c) { return c.slug === slug; });
                var name = cat ? cat.name : slug;
                sel.innerHTML += '<option value="' + slug + '">' + escapeHtml(name) + '</option>';
            });
        }

        function filterBusinesses() {
            return allBusinesses.filter(function(biz) {
                var matchStatus = statusFilter === 'all' || biz.status === statusFilter;
                var matchCategory = categoryFilter === 'all' || biz.category === categoryFilter;
                var matchSearch = true;
                if (searchTerm) {
                    var q = searchTerm.toLowerCase();
                    var cat = DB.categories.find(function(c) { return c.slug === biz.category; });
                    var catName = cat ? cat.name.toLowerCase() : '';
                    matchSearch = biz.name.toLowerCase().indexOf(q) !== -1 ||
                                  catName.indexOf(q) !== -1 ||
                                  (biz.location || '').toLowerCase().indexOf(q) !== -1 ||
                                  (biz.subcategory || '').toLowerCase().indexOf(q) !== -1;
                }
                return matchStatus && matchCategory && matchSearch;
            });
        }

        function renderBusinesses() {
            var list = document.getElementById('bizList');
            var toolbar = document.getElementById('bizToolbar');
            var countEl = document.getElementById('bizCount');
            if (!list) return;

            if (allBusinesses.length === 0) {
                toolbar.style.display = 'none';
                countEl.textContent = '';
                list.innerHTML = '<div class="empty-state">' +
                    '<i class="fas fa-store"></i>' +
                    '<h4>No businesses yet</h4>' +
                    '<p>Start by adding your first business listing to Kuje Connect.</p>' +
                    '<a href="add-business" class="btn-sm btn-primary"><i class="fas fa-plus"></i> Add Your First Business</a>' +
                '</div>';
                return;
            }

            toolbar.style.display = 'flex';
            var filtered = filterBusinesses();
            countEl.textContent = filtered.length + ' of ' + allBusinesses.length + ' businesses';

            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty-state">' +
                    '<i class="fas fa-search"></i>' +
                    '<h4>No businesses found</h4>' +
                    '<p>Try adjusting your search or filter criteria.</p>' +
                '</div>';
                return;
            }

            var html = '';
            filtered.forEach(function(biz) {
                var cat = DB.categories.find(function(c) { return c.slug === biz.category; });
                var catName = cat ? cat.name : biz.category;
                var catIcon = cat ? cat.icon : 'fa-store';
                var iconColor = getCatIconColor(biz.category);
                var imgBg = getCatColor(biz.category);
                var statusClass = biz.status === 'active' ? 'status-active' :
                                  (biz.status === 'pending' ? 'status-pending' : 'status-inactive');
                var statusText = biz.status === 'active' ? 'Active' :
                                 (biz.status === 'pending' ? 'Pending Review' : 'Inactive');
                var ratingText = biz.rating > 0 ?
                    '<span style="color:#f59e0b;"><i class="fas fa-star"></i> ' + biz.rating + '</span>' :
                    '<span>New</span>';

                var imgHtml = '';
                if (biz.images && biz.images[0]) {
                    imgHtml = '<img src="' + escapeHtml(biz.images[0]) + '" alt="' + escapeHtml(biz.name) + '" onerror="this.parentElement.innerHTML=\'<i class=\\\\\'fas ' + catIcon + '\\\\\\'></i>\'">';
                } else {
                    imgHtml = '<i class="fas ' + catIcon + '"></i>';
                }

                html += '<div class="user-card" data-biz-id="' + biz.id + '" style="display:flex;align-items:center;gap:18px;margin-bottom:14px;">' +
                    '<div class="biz-image-thumb" style="background:' + imgBg + ';color:' + iconColor + ';">' +
                        imgHtml +
                    '</div>' +
                    '<div class="biz-info">' +
                        '<h4>' + escapeHtml(biz.name) + (biz.verified ? ' <i class="fas fa-check-circle" style="color:var(--primary);font-size:0.75rem;"></i>' : '') + '</h4>' +
                        '<div class="biz-meta">' +
                            '<span><i class="fas fa-tag"></i> ' + escapeHtml(catName) + '</span>' +
                            '<span>' + ratingText + '</span>' +
                            '<span><i class="fas fa-map-marker-alt"></i> ' + escapeHtml(biz.location || '') + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<span class="status-badge ' + statusClass + '">' + statusText + '</span>' +
                    '<div class="biz-actions">' +
                        '<button class="btn-sm edit-biz-btn" data-biz-id="' + biz.id + '" title="Edit"><i class="fas fa-pen"></i></button>' +
                        '<a href="../public/business?id=' + biz.id + '" class="btn-sm" title="View"><i class="fas fa-eye"></i></a>' +
                        '<button class="btn-sm btn-danger delete-biz-btn" data-biz-id="' + biz.id + '" title="Delete"><i class="fas fa-trash"></i></button>' +
                    '</div>' +
                '</div>';
            });

            list.innerHTML = html;
            attachCardEvents();
        }

        function attachCardEvents() {
            document.querySelectorAll('.edit-biz-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var bizId = this.getAttribute('data-biz-id');
                    openEditModal(bizId);
                });
            });

            document.querySelectorAll('.delete-biz-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var bizId = this.getAttribute('data-biz-id');
                    var biz = allBusinesses.find(function(b) { return b.id === bizId; });
                    var name = biz ? biz.name : 'this business';
                    confirmAction('Are you sure you want to delete "' + name + '"? This action cannot be undone.', function() {
                        deleteBusiness(bizId);
                        showToast('Business deleted successfully', 'success');
                        loadBusinesses();
                    });
                });
            });
        }

        function openEditModal(bizId) {
            var biz = DB.businesses.find(function(b) { return b.id === bizId; });
            if (!biz) return;

            document.getElementById('editBizId').value = biz.id;
            document.getElementById('editBizName').value = biz.name || '';
            document.getElementById('editBizDesc').value = biz.description || '';
            document.getElementById('editBizAddress').value = biz.address || '';
            document.getElementById('editBizLocation').value = biz.location || '';
            document.getElementById('editBizPhone').value = biz.phone || '';
            document.getElementById('editBizEmail').value = biz.email || '';
            document.getElementById('editBizWebsite').value = biz.website || '';

            var catSel = document.getElementById('editBizCategory');
            catSel.innerHTML = '';
            DB.categories.forEach(function(cat) {
                var opt = document.createElement('option');
                opt.value = cat.slug;
                opt.textContent = cat.name;
                if (cat.slug === biz.category) opt.selected = true;
                catSel.appendChild(opt);
            });

            document.getElementById('editModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function saveEditModal() {
            var bizId = document.getElementById('editBizId').value;
            var name = document.getElementById('editBizName').value.trim();
            var category = document.getElementById('editBizCategory').value;
            var desc = document.getElementById('editBizDesc').value.trim();
            var address = document.getElementById('editBizAddress').value.trim();
            var location = document.getElementById('editBizLocation').value.trim();
            var phone = document.getElementById('editBizPhone').value.trim();
            var email = document.getElementById('editBizEmail').value.trim();
            var website = document.getElementById('editBizWebsite').value.trim();

            if (!name) { showToast('Business name is required', 'error'); return; }
            if (!category) { showToast('Please select a category', 'error'); return; }
            if (!desc) { showToast('Description is required', 'error'); return; }
            if (!address) { showToast('Address is required', 'error'); return; }
            if (!phone) { showToast('Phone number is required', 'error'); return; }

            var cat = DB.categories.find(function(c) { return c.slug === category; });

            saveBusiness({
                name: name,
                category: category,
                subcategory: cat ? cat.name : category,
                description: desc,
                address: address,
                location: location || user.location || 'Kuje',
                phone: phone,
                email: email,
                website: website || null
            }, bizId);

            closeEditModal();
            showToast('Business updated successfully', 'success');
            loadBusinesses();
        }

        document.getElementById('modalCloseBtn').addEventListener('click', closeEditModal);
        document.getElementById('modalCancelBtn').addEventListener('click', closeEditModal);
        document.getElementById('modalSaveBtn').addEventListener('click', saveEditModal);
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeEditModal();
        });

        document.getElementById('bizSearchInput').addEventListener('input', function() {
            searchTerm = this.value.trim();
            renderBusinesses();
        });
        document.getElementById('bizStatusFilter').addEventListener('change', function() {
            statusFilter = this.value;
            renderBusinesses();
        });
        document.getElementById('bizCategoryFilter').addEventListener('change', function() {
            categoryFilter = this.value;
            renderBusinesses();
        });

        loadBusinesses();
    })();
    </script>
</body>
</html>
