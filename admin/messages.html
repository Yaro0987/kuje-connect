<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Kuje Connect Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-body { background: #f1f5f9; }
        .messages-container {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 0;
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.04);
            overflow: hidden;
            height: calc(100vh - 140px);
            min-height: 600px;
        }
        .conversations-panel {
            border-right: 1px solid var(--gray-lighter);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .conversations-header {
            padding: 20px;
            border-bottom: 1px solid var(--gray-lighter);
            flex-shrink: 0;
        }
        .conversations-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .conversations-header h2 i {
            color: var(--primary);
        }
        .search-box {
            position: relative;
            margin-bottom: 12px;
        }
        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 0.85rem;
        }
        .search-box input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1.5px solid var(--gray-lighter);
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-family: inherit;
            color: var(--dark);
            background: #f8fafc;
            transition: all 0.2s;
            outline: none;
            box-sizing: border-box;
        }
        .search-box input:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(22,163,74,0.08);
        }
        .search-box input::placeholder { color: #94a3b8; }
        .filter-tabs {
            display: flex;
            gap: 6px;
        }
        .filter-tab {
            padding: 6px 14px;
            font-size: 0.78rem;
            font-weight: 600;
            border-radius: 50px;
            border: 1.5px solid var(--gray-lighter);
            background: #fff;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-tab.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .filter-tab:hover:not(.active) {
            border-color: var(--primary);
            color: var(--primary);
        }
        .filter-tab .count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.1);
            color: inherit;
            min-width: 18px;
            height: 18px;
            border-radius: 50px;
            font-size: 0.68rem;
            margin-left: 4px;
            padding: 0 5px;
        }
        .filter-tab.active .count {
            background: rgba(255,255,255,0.25);
        }
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }
        .conversations-list::-webkit-scrollbar { width: 5px; }
        .conversations-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .conversation-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--gray-lighter);
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }
        .conversation-item:hover {
            background: rgba(22,163,74,0.03);
        }
        .conversation-item.active {
            background: rgba(22,163,74,0.06);
            border-left: 3px solid var(--primary);
        }
        .conversation-item.unread {
            background: rgba(22,163,74,0.02);
        }
        .conversation-item.unread .conv-name {
            font-weight: 700;
        }
        .conversation-item.unread .conv-preview {
            color: var(--dark);
            font-weight: 500;
        }
        .conv-avatar {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid #f1f5f9;
        }
        .conv-avatar-wrap {
            position: relative;
            flex-shrink: 0;
        }
        .online-dot {
            width: 10px;
            height: 10px;
            background: #16a34a;
            border-radius: 50%;
            border: 2px solid #fff;
            position: absolute;
            bottom: 1px;
            right: 1px;
        }
        .conv-info {
            flex: 1;
            min-width: 0;
        }
        .conv-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        .conv-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .conv-time {
            font-size: 0.7rem;
            color: var(--gray);
            white-space: nowrap;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .conv-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .conv-preview {
            font-size: 0.78rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .conv-unread-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: #fff;
            min-width: 20px;
            height: 20px;
            border-radius: 50px;
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0 6px;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .conv-role-tag {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 1px 6px;
            border-radius: 50px;
            margin-left: 6px;
            white-space: nowrap;
        }
        .conv-role-tag.customer { background: #dbeafe; color: #2563eb; }
        .conv-role-tag.business_owner { background: #fef3c7; color: #d97706; }
        .chat-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            padding: 16px 22px;
            border-bottom: 1px solid var(--gray-lighter);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            background: #fff;
        }
        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        .chat-header-info {
            flex: 1;
        }
        .chat-header-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--dark);
        }
        .chat-header-status {
            font-size: 0.75rem;
            color: #16a34a;
            font-weight: 500;
        }
        .chat-header-actions {
            display: flex;
            gap: 6px;
        }
        .chat-header-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1.5px solid var(--gray-lighter);
            background: #fff;
            color: var(--gray);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.85rem;
        }
        .chat-header-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 22px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: #f8fafc;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .message-group {
            display: flex;
            gap: 10px;
            max-width: 75%;
            margin-bottom: 4px;
        }
        .message-group.received {
            align-self: flex-start;
        }
        .message-group.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .msg-content {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .msg-sender-name {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 2px;
            padding: 0 4px;
        }
        .message-group.sent .msg-sender-name {
            text-align: right;
        }
        .msg-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.85rem;
            line-height: 1.5;
            word-break: break-word;
        }
        .message-group.received .msg-bubble {
            background: #fff;
            color: var(--dark);
            border: 1px solid var(--gray-lighter);
            border-bottom-left-radius: 4px;
        }
        .message-group.sent .msg-bubble {
            background: var(--primary);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg-image {
            max-width: 220px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 4px;
        }
        .msg-image img {
            width: 100%;
            display: block;
        }
        .msg-time {
            font-size: 0.68rem;
            color: #94a3b8;
            padding: 0 4px;
            margin-top: 2px;
        }
        .message-group.sent .msg-time {
            text-align: right;
        }
        .msg-date-divider {
            text-align: center;
            margin: 16px 0;
            position: relative;
        }
        .msg-date-divider span {
            background: #f1f5f9;
            color: var(--gray);
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 50px;
            position: relative;
            z-index: 1;
        }
        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            background: #f8fafc;
        }
        .chat-empty i {
            font-size: 4rem;
            color: #e2e8f0;
            margin-bottom: 16px;
        }
        .chat-empty h3 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px;
        }
        .chat-empty p {
            font-size: 0.85rem;
            color: var(--gray);
        }
        .conv-list-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
        }
        .conv-list-empty i {
            font-size: 2.5rem;
            color: #e2e8f0;
            margin-bottom: 10px;
            display: block;
        }
        .conv-list-empty p {
            font-size: 0.85rem;
        }
        .admin-page-header {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .admin-page-header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--dark);
        }
        .admin-page-header p {
            font-size: 0.85rem;
            color: var(--gray);
            margin-top: 2px;
        }
        .stats-row {
            display: flex;
            gap: 12px;
        }
        .mini-stat {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #f8fafc;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--gray);
            border: 1px solid var(--gray-lighter);
        }
        .mini-stat i {
            font-size: 0.75rem;
        }
        .mini-stat strong {
            color: var(--dark);
        }
        .participant-chips {
            display: flex;
            gap: 6px;
            padding: 10px 22px;
            border-bottom: 1px solid var(--gray-lighter);
            background: #fff;
            flex-shrink: 0;
        }
        .participant-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px 4px 4px;
            background: #f1f5f9;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--dark);
        }
        .participant-chip img {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            object-fit: cover;
        }
        @media (max-width: 1024px) {
            .messages-container {
                grid-template-columns: 300px 1fr;
            }
        }
        @media (max-width: 768px) {
            .messages-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .conversations-panel {
                max-height: 400px;
            }
            .chat-panel {
                min-height: 500px;
            }
        }
    </style>
</head>
<body class="admin-body">
    <div id="admin-header"></div>

    <main class="admin-main">
        <div class="admin-page-header">
            <div>
                <h1><i class="fas fa-comments" style="color:var(--primary);margin-right:8px;"></i>Messages</h1>
                <p>View and monitor all user conversations</p>
            </div>
            <div class="stats-row">
                <div class="mini-stat"><i class="fas fa-comments" style="color:#2563eb;"></i> Total: <strong id="statTotalConv">0</strong></div>
                <div class="mini-stat"><i class="fas fa-circle" style="color:#dc2626;font-size:0.5rem;"></i> Unread: <strong id="statUnreadConv">0</strong></div>
                <div class="mini-stat"><i class="fas fa-envelope" style="color:#d97706;"></i> Messages: <strong id="statTotalMsg">0</strong></div>
            </div>
        </div>

        <div class="messages-container">
            <div class="conversations-panel">
                <div class="conversations-header">
                    <h2><i class="fas fa-inbox"></i> Conversations</h2>
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="convSearch" placeholder="Search conversations..." oninput="filterConversations()">
                    </div>
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-filter="all" onclick="setFilter('all', this)">All <span class="count" id="filterAllCount">0</span></button>
                        <button class="filter-tab" data-filter="unread" onclick="setFilter('unread', this)">Unread <span class="count" id="filterUnreadCount">0</span></button>
                    </div>
                </div>
                <div class="conversations-list" id="conversationsList"></div>
            </div>
            <div class="chat-panel" id="chatPanel">
                <div class="chat-empty" id="chatEmpty">
                    <i class="fas fa-comments"></i>
                    <h3>Select a Conversation</h3>
                    <p>Choose a conversation from the list to view messages</p>
                </div>
                <div id="chatContent" style="display:none;flex-direction:column;flex:1;overflow:hidden;"></div>
            </div>
        </div>
    </main>

    <div id="admin-footer"></div>

    <script src="../data/data.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        var currentFilter = 'all';
        var activeConvId = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadAdminPartials();
            updateStats();
            renderConversations();
        });

        function loadAdminPartials() {
            fetch('includes/admin-header.html')
                .then(function(r) { return r.text(); })
                .then(function(h) {
                    document.getElementById('admin-header').innerHTML = h;
                    if (typeof initAdminSidebar === 'function') initAdminSidebar();
                });
            fetch('includes/admin-footer.html')
                .then(function(r) { return r.text(); })
                .then(function(h) {
                    document.getElementById('admin-footer').innerHTML = h;
                });
        }

        function getUserById(id) {
            return DB.users.find(function(u) { return u.id === id; });
        }

        function getOtherParticipant(conv) {
            if (conv.participants.length >= 2) {
                return getUserById(conv.participants[1]);
            }
            return getUserById(conv.participants[0]);
        }

        function getFirstParticipant(conv) {
            return getUserById(conv.participants[0]);
        }

        function formatConvTime(dateStr) {
            var now = new Date();
            var d = new Date(dateStr);
            var diff = Math.floor((now - d) / 1000);
            if (diff < 60) return 'Now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h';
            if (diff < 604800) return Math.floor(diff / 86400) + 'd';
            var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return months[d.getMonth()] + ' ' + d.getDate();
        }

        function formatMsgTime(dateStr) {
            var d = new Date(dateStr);
            var hours = d.getHours();
            var mins = d.getMinutes();
            var ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            return hours + ':' + (mins < 10 ? '0' : '') + mins + ' ' + ampm;
        }

        function formatDateDivider(dateStr) {
            var d = new Date(dateStr);
            var now = new Date();
            var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            var msgDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            var diff = Math.floor((today - msgDay) / 86400000);
            if (diff === 0) return 'Today';
            if (diff === 1) return 'Yesterday';
            var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
        }

        function getDateKey(dateStr) {
            var d = new Date(dateStr);
            return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
        }

        function updateStats() {
            var total = DB.conversations.length;
            var unread = DB.conversations.filter(function(c) { return c.unreadCount > 0; }).length;
            var totalMsg = DB.messages.length;
            document.getElementById('statTotalConv').textContent = total;
            document.getElementById('statUnreadConv').textContent = unread;
            document.getElementById('statTotalMsg').textContent = totalMsg;
            document.getElementById('filterAllCount').textContent = total;
            document.getElementById('filterUnreadCount').textContent = unread;
        }

        function getFilteredConversations() {
            var search = document.getElementById('convSearch').value.toLowerCase().trim();
            var convs = DB.conversations.slice();

            if (currentFilter === 'unread') {
                convs = convs.filter(function(c) { return c.unreadCount > 0; });
            }

            if (search) {
                convs = convs.filter(function(c) {
                    var user = getOtherParticipant(c);
                    if (!user) return false;
                    var nameMatch = user.name.toLowerCase().indexOf(search) !== -1;
                    var msgMatch = c.lastMessage.toLowerCase().indexOf(search) !== -1;
                    var business = DB.businesses.find(function(b) { return b.ownerId === user.id; });
                    var bizMatch = business && business.name.toLowerCase().indexOf(search) !== -1;
                    return nameMatch || msgMatch || bizMatch;
                });
            }

            convs.sort(function(a, b) {
                return new Date(b.lastMessageTime) - new Date(a.lastMessageTime);
            });

            return convs;
        }

        function renderConversations() {
            var container = document.getElementById('conversationsList');
            var convs = getFilteredConversations();

            if (convs.length === 0) {
                container.innerHTML = '<div class="conv-list-empty"><i class="fas fa-search"></i><p>No conversations found</p></div>';
                return;
            }

            var html = '';
            convs.forEach(function(conv) {
                var user = getOtherParticipant(conv);
                if (!user) return;
                var isUnread = conv.unreadCount > 0;
                var isActive = conv.id === activeConvId;
                var business = DB.businesses.find(function(b) { return b.ownerId === user.id; });
                var roleLabel = user.role === 'business_owner' ? 'Business' : 'Customer';
                var roleClass = user.role === 'business_owner' ? 'business_owner' : 'customer';

                html += '<div class="conversation-item' + (isActive ? ' active' : '') + (isUnread ? ' unread' : '') + '" onclick="openConversation(\'' + conv.id + '\')" data-conv-id="' + conv.id + '">' +
                    '<div class="conv-avatar-wrap">' +
                        '<img src="' + user.avatar + '" alt="' + user.name + '" class="conv-avatar" onerror="this.src=\'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=16a34a&color=fff&size=92\'">' +
                    '</div>' +
                    '<div class="conv-info">' +
                        '<div class="conv-top">' +
                            '<span class="conv-name">' + (business ? business.name : user.name) + '<span class="conv-role-tag ' + roleClass + '">' + roleLabel + '</span></span>' +
                            '<span class="conv-time">' + formatConvTime(conv.lastMessageTime) + '</span>' +
                        '</div>' +
                        '<div class="conv-bottom">' +
                            '<span class="conv-preview">' + conv.lastMessage + '</span>' +
                            (isUnread ? '<span class="conv-unread-badge">' + conv.unreadCount + '</span>' : '') +
                        '</div>' +
                    '</div>' +
                '</div>';
            });
            container.innerHTML = html;
        }

        function filterConversations() {
            renderConversations();
        }

        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });
            btn.classList.add('active');
            renderConversations();
        }

        function openConversation(convId) {
            activeConvId = convId;
            var conv = DB.conversations.find(function(c) { return c.id === convId; });
            if (!conv) return;

            var chatEmpty = document.getElementById('chatEmpty');
            var chatContent = document.getElementById('chatContent');
            chatEmpty.style.display = 'none';
            chatContent.style.display = 'flex';

            var user1 = getFirstParticipant(conv);
            var user2 = getOtherParticipant(conv);
            var business = DB.businesses.find(function(b) { return b.ownerId === user2.id; });

            var convMsgs = DB.messages.filter(function(m) { return m.conversationId === convId; });
            convMsgs.sort(function(a, b) { return new Date(a.timestamp) - new Date(b.timestamp); });

            var headerHtml = '<div class="chat-header">' +
                '<img src="' + user2.avatar + '" alt="' + user2.name + '" class="chat-header-avatar" onerror="this.src=\'https://ui-avatars.com/api/?name=' + encodeURIComponent(user2.name) + '&background=16a34a&color=fff&size=80\'">' +
                '<div class="chat-header-info">' +
                    '<div class="chat-header-name">' + (business ? business.name : user2.name) + '</div>' +
                    '<div class="chat-header-status"><i class="fas fa-circle" style="font-size:0.45rem;margin-right:4px;"></i>Active</div>' +
                '</div>' +
                '<div class="chat-header-actions">' +
                    '<button class="chat-header-btn" title="View Profile"><i class="fas fa-user"></i></button>' +
                    '<button class="chat-header-btn" title="More Options"><i class="fas fa-ellipsis-v"></i></button>' +
                '</div>' +
            '</div>';

            var chipsHtml = '<div class="participant-chips">' +
                '<div class="participant-chip"><img src="' + user1.avatar + '" alt="' + user1.name + '" onerror="this.src=\'https://ui-avatars.com/api/?name=' + encodeURIComponent(user1.name) + '&background=94a3b8&color=fff&size=44\'">' + user1.name + '</div>' +
                '<div class="participant-chip"><img src="' + user2.avatar + '" alt="' + user2.name + '" onerror="this.src=\'https://ui-avatars.com/api/?name=' + encodeURIComponent(user2.name) + '&background=16a34a&color=fff&size=44\'">' + (business ? business.name : user2.name) + '</div>' +
            '</div>';

            var messagesHtml = '';
            var lastDate = '';
            convMsgs.forEach(function(msg) {
                var dateKey = getDateKey(msg.timestamp);
                if (dateKey !== lastDate) {
                    messagesHtml += '<div class="msg-date-divider"><span>' + formatDateDivider(msg.timestamp) + '</span></div>';
                    lastDate = dateKey;
                }

                var sender = getUserById(msg.senderId);
                if (!sender) return;
                var isSent = msg.senderId === user2.id;
                var senderName = sender.name;
                var groupClass = isSent ? 'sent' : 'received';

                var bubbleContent = '';
                if (msg.type === 'image' && msg.fileUrl) {
                    bubbleContent = '<div class="msg-image"><img src="' + msg.fileUrl + '" alt="Shared image"></div>';
                    if (msg.text) bubbleContent += '<div class="msg-bubble">' + msg.text + '</div>';
                } else {
                    bubbleContent = '<div class="msg-bubble">' + msg.text + '</div>';
                }

                messagesHtml += '<div class="message-group ' + groupClass + '">' +
                    '<img src="' + sender.avatar + '" alt="' + sender.name + '" class="msg-avatar" onerror="this.src=\'https://ui-avatars.com/api/?name=' + encodeURIComponent(sender.name) + '&background=94a3b8&color=fff&size=64\'">' +
                    '<div class="msg-content">' +
                        '<div class="msg-sender-name">' + senderName + '</div>' +
                        bubbleContent +
                        '<div class="msg-time">' + formatMsgTime(msg.timestamp) + '</div>' +
                    '</div>' +
                '</div>';
            });

            chatContent.innerHTML = headerHtml + chipsHtml + '<div class="chat-messages" id="chatMessages">' + messagesHtml + '</div>';

            renderConversations();

            setTimeout(function() {
                var chatMessages = document.getElementById('chatMessages');
                if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 50);
        }
    </script>
</body>
</html>
