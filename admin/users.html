<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Kuje Connect Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-body { background: #f1f5f9; }

        .admin-filter-bar {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.04);
            padding: 16px 22px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            opacity: 0;
            transform: translateY(20px);
        }
        .admin-filter-bar.animate-in {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.4s ease;
        }
        .filter-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .filter-tab {
            padding: 7px 16px;
            border-radius: 50px;
            border: none;
            background: #f1f5f9;
            color: #64748b;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }
        .filter-tab:hover {
            background: rgba(22,163,74,0.08);
            color: #16a34a;
        }
        .filter-tab.active {
            background: #16a34a;
            color: #fff;
        }
        .filter-tab .tab-count {
            display: inline-block;
            background: rgba(0,0,0,0.08);
            padding: 1px 7px;
            border-radius: 50px;
            font-size: 0.7rem;
            margin-left: 4px;
        }
        .filter-tab.active .tab-count {
            background: rgba(255,255,255,0.25);
        }
        .filter-search {
            position: relative;
            flex-shrink: 0;
        }
        .filter-search input {
            padding: 9px 16px 9px 38px;
            border: 1.5px solid #e2e8f0;
            border-radius: 50px;
            font-size: 0.85rem;
            font-family: inherit;
            width: 280px;
            outline: none;
            transition: all 0.2s;
            color: var(--dark);
            background: #f8fafc;
        }
        .filter-search input:focus {
            border-color: #16a34a;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(22,163,74,0.1);
        }
        .filter-search input::placeholder {
            color: #94a3b8;
        }
        .filter-search i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .users-table-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.04);
            overflow: hidden;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(20px);
        }
        .users-table-card.animate-in {
            opacity: 1;
            transform: translateY(0);
            transition: all 0.4s ease 0.1s;
        }
        .users-table-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px;
            border-bottom: 1px solid var(--gray-lighter);
        }
        .users-table-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--dark);
        }
        .users-table-header .result-count {
            font-size: 0.82rem;
            color: var(--gray);
            font-weight: 500;
        }
        .users-table-wrapper {
            overflow-x: auto;
        }
        .users-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }
        .users-table thead th {
            padding: 12px 16px;
            text-align: left;
            font-size: 0.72rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: #f8fafc;
            border-bottom: 1px solid var(--gray-lighter);
            white-space: nowrap;
            position: sticky;
            top: 0;
        }
        .users-table tbody tr {
            transition: background 0.15s;
            border-bottom: 1px solid #f1f5f9;
        }
        .users-table tbody tr:last-child {
            border-bottom: none;
        }
        .users-table tbody tr:hover {
            background: rgba(22,163,74,0.02);
        }
        .users-table tbody td {
            padding: 14px 16px;
            font-size: 0.85rem;
            color: var(--dark);
            vertical-align: middle;
        }
        .user-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 180px;
        }
        .user-cell img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid #f1f5f9;
        }
        .user-cell-name {
            font-weight: 600;
            color: var(--dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }
        .user-cell-email {
            font-size: 0.75rem;
            color: var(--gray);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .user-cell-phone {
            color: #64748b;
            font-size: 0.82rem;
            white-space: nowrap;
        }
        .user-cell-location {
            color: #64748b;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .user-cell-location i {
            color: #94a3b8;
            font-size: 0.75rem;
        }
        .user-cell-date {
            font-size: 0.82rem;
            color: #64748b;
            white-space: nowrap;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        .badge-success { background: rgba(22,163,74,0.1); color: #16a34a; }
        .badge-warning { background: rgba(234,179,8,0.12); color: #ca8a04; }
        .badge-danger { background: rgba(220,38,38,0.1); color: #dc2626; }
        .badge-info { background: rgba(59,130,246,0.1); color: #2563eb; }
        .badge-neutral { background: #f1f5f9; color: #64748b; }

        .user-actions {
            display: flex;
            gap: 5px;
            align-items: center;
            white-space: nowrap;
        }
        .action-btn {
            padding: 6px 10px;
            font-size: 0.72rem;
            font-weight: 600;
            border-radius: var(--radius-xs);
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .action-btn-primary {
            background: rgba(22,163,74,0.1);
            color: #16a34a;
        }
        .action-btn-primary:hover { background: #16a34a; color: #fff; }
        .action-btn-info {
            background: rgba(59,130,246,0.1);
            color: #2563eb;
        }
        .action-btn-info:hover { background: #2563eb; color: #fff; }
        .action-btn-warning {
            background: rgba(234,179,8,0.12);
            color: #ca8a04;
        }
        .action-btn-warning:hover { background: #ca8a04; color: #fff; }
        .action-btn-danger {
            background: rgba(220,38,38,0.1);
            color: #dc2626;
        }
        .action-btn-danger:hover { background: #dc2626; color: #fff; }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 22px;
            border-top: 1px solid var(--gray-lighter);
            flex-wrap: wrap;
            gap: 12px;
        }
        .pagination-info {
            font-size: 0.82rem;
            color: var(--gray);
        }
        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .pagination-btn {
            padding: 7px 12px;
            font-size: 0.78rem;
            font-weight: 600;
            border-radius: var(--radius-xs);
            border: 1.5px solid #e2e8f0;
            background: #fff;
            color: var(--dark);
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            min-width: 36px;
            text-align: center;
        }
        .pagination-btn:hover:not(:disabled):not(.active) {
            border-color: #16a34a;
            color: #16a34a;
        }
        .pagination-btn.active {
            background: #16a34a;
            color: #fff;
            border-color: #16a34a;
        }
        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination-page-size {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pagination-page-size label {
            font-size: 0.82rem;
            color: var(--gray);
        }
        .pagination-page-size select {
            padding: 5px 10px;
            border: 1.5px solid #e2e8f0;
            border-radius: var(--radius-xs);
            font-size: 0.82rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            color: var(--dark);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }
        .empty-state i {
            font-size: 2.5rem;
            color: #e2e8f0;
            margin-bottom: 12px;
            display: block;
        }
        .empty-state h4 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 0.85rem;
        }

        /* Modal Overlay */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9998;
            animation: fadeIn 0.2s ease;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* View/Edit User Modal */
        .user-modal {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            width: 95%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            z-index: 9999;
            animation: slideUp 0.3s ease;
        }
        .user-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-lighter);
        }
        .user-modal-header h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--dark);
        }
        .user-modal-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: #f1f5f9;
            color: #64748b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .user-modal-close:hover {
            background: #e2e8f0;
            color: var(--dark);
        }
        .user-modal-body {
            padding: 24px;
        }
        .user-profile-section {
            text-align: center;
            margin-bottom: 24px;
        }
        .user-profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #f1f5f9;
            margin-bottom: 12px;
        }
        .user-profile-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 4px;
        }
        .user-profile-email {
            font-size: 0.85rem;
            color: var(--gray);
            margin-bottom: 10px;
        }
        .user-profile-badges {
            display: flex;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .user-detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .user-detail-item {
            background: #f8fafc;
            border-radius: var(--radius-sm);
            padding: 14px 16px;
        }
        .user-detail-item label {
            display: block;
            font-size: 0.72rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }
        .user-detail-item span {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--dark);
        }
        .user-detail-full {
            grid-column: 1 / -1;
        }
        .user-modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--gray-lighter);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }
        .btn {
            padding: 9px 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: var(--radius-xs);
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: #16a34a;
            color: #fff;
        }
        .btn-primary:hover { background: #15803d; }
        .btn-secondary {
            background: #f1f5f9;
            color: var(--dark);
        }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-danger {
            background: #dc2626;
            color: #fff;
        }
        .btn-danger:hover { background: #b91c1c; }
        .btn-warning {
            background: #ca8a04;
            color: #fff;
        }
        .btn-warning:hover { background: #a16207; }

        /* Suspend Modal */
        .suspend-modal {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            width: 95%;
            max-width: 440px;
            position: relative;
            z-index: 9999;
            animation: slideUp 0.3s ease;
        }
        .suspend-modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-lighter);
        }
        .suspend-modal-header h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: #dc2626;
        }
        .suspend-modal-body {
            padding: 24px;
        }
        .suspend-modal-body p {
            font-size: 0.88rem;
            color: #64748b;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .suspend-modal-body .user-highlight {
            font-weight: 600;
            color: var(--dark);
        }
        .suspend-reason-group {
            margin-bottom: 16px;
        }
        .suspend-reason-group label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 6px;
        }
        .suspend-reason-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-family: inherit;
            resize: vertical;
            min-height: 80px;
            outline: none;
            transition: border-color 0.2s;
            color: var(--dark);
        }
        .suspend-reason-group textarea:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220,38,38,0.1);
        }
        .suspend-reason-group textarea::placeholder {
            color: #94a3b8;
        }
        .suspend-modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--gray-lighter);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 1024px) {
            .admin-filter-bar { flex-direction: column; align-items: stretch; }
            .filter-tabs { justify-content: center; }
            .filter-search { width: 100%; }
            .filter-search input { width: 100%; }
        }
        @media (max-width: 640px) {
            .filter-tabs { gap: 3px; }
            .filter-tab { padding: 6px 10px; font-size: 0.72rem; }
            .user-detail-grid { grid-template-columns: 1fr; }
            .pagination { flex-direction: column; align-items: stretch; }
            .pagination-controls { justify-content: center; }
        }
    </style>
</head>
<body class="admin-body">
    <!-- header placeholder -->
    <div id="admin-header"></div>

    <main class="admin-main">
        <!-- Filter Bar -->
        <div class="admin-filter-bar">
            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" data-filter="all">All <span class="tab-count" id="countAll">0</span></button>
                <button class="filter-tab" data-filter="active">Active <span class="tab-count" id="countActive">0</span></button>
                <button class="filter-tab" data-filter="inactive">Inactive <span class="tab-count" id="countInactive">0</span></button>
                <button class="filter-tab" data-filter="suspended">Suspended <span class="tab-count" id="countSuspended">0</span></button>
                <button class="filter-tab" data-filter="admin">Admins <span class="tab-count" id="countAdmin">0</span></button>
                <button class="filter-tab" data-filter="business_owner">Business Owners <span class="tab-count" id="countBiz">0</span></button>
                <button class="filter-tab" data-filter="customer">Customers <span class="tab-count" id="countCustomer">0</span></button>
            </div>
            <div class="filter-search">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search by name, email, phone...">
            </div>
        </div>

        <!-- Users Table Card -->
        <div class="users-table-card">
            <div class="users-table-header">
                <h3>Users</h3>
                <span class="result-count" id="resultCount">Showing 0 of 0 users</span>
            </div>
            <div class="users-table-wrapper">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Role</th>
                            <th>Location</th>
                            <th>Status</th>
                            <th>Joined</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                    </tbody>
                </table>
            </div>
            <div class="pagination" id="pagination">
                <div class="pagination-info" id="paginationInfo"></div>
                <div class="pagination-controls" id="paginationControls"></div>
                <div class="pagination-page-size">
                    <label>Per page:</label>
                    <select id="pageSize">
                        <option value="10">10</option>
                        <option value="25" selected>25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                </div>
            </div>
        </div>
    </main>

    <!-- View/Edit User Modal -->
    <div class="modal-overlay" id="viewModal">
        <div class="user-modal">
            <div class="user-modal-header">
                <h3 id="viewModalTitle">User Details</h3>
                <button class="user-modal-close" onclick="closeViewModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="user-modal-body" id="viewModalBody">
            </div>
            <div class="user-modal-footer" id="viewModalFooter">
            </div>
        </div>
    </div>

    <!-- Suspend User Modal -->
    <div class="modal-overlay" id="suspendModal">
        <div class="suspend-modal">
            <div class="suspend-modal-header">
                <h3><i class="fas fa-ban" style="margin-right:6px;"></i> Suspend User</h3>
                <button class="user-modal-close" onclick="closeSuspendModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="suspend-modal-body">
                <p>Are you sure you want to suspend <span class="user-highlight" id="suspendUserName"></span>? This will prevent them from accessing the platform.</p>
                <div class="suspend-reason-group">
                    <label>Reason for suspension</label>
                    <textarea id="suspendReason" placeholder="Enter the reason for suspending this user..."></textarea>
                </div>
            </div>
            <div class="suspend-modal-footer">
                <button class="btn btn-secondary" onclick="closeSuspendModal()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmSuspend()"><i class="fas fa-ban"></i> Suspend User</button>
            </div>
        </div>
    </div>

    <!-- footer placeholder -->
    <div id="admin-footer"></div>

    <script src="../data/data.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        var currentFilter = 'all';
        var searchQuery = '';
        var currentPage = 1;
        var pageSize = 25;
        var filteredUsers = [];
        var pendingSuspendUserId = null;

        document.addEventListener('DOMContentLoaded', function() {
            loadAdminPartials();
            animateCards();
            updateFilterCounts();
            applyFilters();

            document.querySelectorAll('.filter-tab').forEach(function(tab) {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });
                    this.classList.add('active');
                    currentFilter = this.getAttribute('data-filter');
                    currentPage = 1;
                    applyFilters();
                });
            });

            document.getElementById('searchInput').addEventListener('input', function() {
                searchQuery = this.value.trim().toLowerCase();
                currentPage = 1;
                applyFilters();
            });

            document.getElementById('pageSize').addEventListener('change', function() {
                pageSize = parseInt(this.value);
                currentPage = 1;
                applyFilters();
            });

            document.getElementById('viewModal').addEventListener('click', function(e) {
                if (e.target === this) closeViewModal();
            });
            document.getElementById('suspendModal').addEventListener('click', function(e) {
                if (e.target === this) closeSuspendModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeViewModal();
                    closeSuspendModal();
                }
            });
        });

        function loadAdminPartials() {
            fetch('includes/admin-header.html')
                .then(function(r) { return r.text(); })
                .then(function(h) {
                    document.getElementById('admin-header').innerHTML = h;
                    if (typeof initAdminSidebar === 'function') initAdminSidebar();
                });
            fetch('includes/admin-footer.html')
                .then(function(r) { return r.text(); })
                .then(function(h) {
                    document.getElementById('admin-footer').innerHTML = h;
                });
        }

        function animateCards() {
            var items = document.querySelectorAll('.admin-filter-bar, .users-table-card');
            items.forEach(function(el, i) {
                setTimeout(function() { el.classList.add('animate-in'); }, i * 120);
            });
        }

        function updateFilterCounts() {
            var users = DB.users;
            document.getElementById('countAll').textContent = users.length;
            document.getElementById('countActive').textContent = users.filter(function(u) { return u.status === 'active'; }).length;
            document.getElementById('countInactive').textContent = users.filter(function(u) { return u.status === 'inactive'; }).length;
            document.getElementById('countSuspended').textContent = users.filter(function(u) { return u.status === 'suspended'; }).length;
            document.getElementById('countAdmin').textContent = users.filter(function(u) { return u.role === 'admin'; }).length;
            document.getElementById('countBiz').textContent = users.filter(function(u) { return u.role === 'business_owner'; }).length;
            document.getElementById('countCustomer').textContent = users.filter(function(u) { return u.role === 'customer'; }).length;
        }

        function applyFilters() {
            var users = DB.users.slice();

            if (currentFilter !== 'all') {
                if (['active', 'inactive', 'suspended'].indexOf(currentFilter) !== -1) {
                    users = users.filter(function(u) { return u.status === currentFilter; });
                } else {
                    users = users.filter(function(u) { return u.role === currentFilter; });
                }
            }

            if (searchQuery) {
                users = users.filter(function(u) {
                    return u.name.toLowerCase().indexOf(searchQuery) !== -1 ||
                           u.email.toLowerCase().indexOf(searchQuery) !== -1 ||
                           u.phone.indexOf(searchQuery) !== -1 ||
                           (u.location && u.location.toLowerCase().indexOf(searchQuery) !== -1) ||
                           u.role.replace('_', ' ').indexOf(searchQuery) !== -1;
                });
            }

            users.sort(function(a, b) {
                return new Date(b.joinDate) - new Date(a.joinDate);
            });

            filteredUsers = users;
            renderUsersTable();
            renderPagination();
        }

        function renderUsersTable() {
            var tbody = document.getElementById('usersTableBody');
            var start = (currentPage - 1) * pageSize;
            var end = start + pageSize;
            var pageUsers = filteredUsers.slice(start, end);

            document.getElementById('resultCount').textContent = 'Showing ' + (filteredUsers.length > 0 ? start + 1 : 0) + '-' + Math.min(end, filteredUsers.length) + ' of ' + filteredUsers.length + ' users';

            if (pageUsers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><i class="fas fa-users"></i><h4>No users found</h4><p>Try adjusting your filters or search query.</p></div></td></tr>';
                return;
            }

            var html = '';
            pageUsers.forEach(function(user) {
                var roleBadge = getRoleBadge(user.role);
                var statusBadge = getStatusBadge(user.status);

                html += '<tr>' +
                    '<td><div class="user-cell">' +
                        '<img src="' + user.avatar + '" alt="' + escapeHtml(user.name) + '" onerror="this.src=\'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=16a34a&color=fff&size=76\'">' +
                        '<div><div class="user-cell-name">' + escapeHtml(user.name) + '</div></div>' +
                    '</div></td>' +
                    '<td><div class="user-cell-email">' + escapeHtml(user.email) + '</div></td>' +
                    '<td><div class="user-cell-phone">' + escapeHtml(user.phone) + '</div></td>' +
                    '<td>' + roleBadge + '</td>' +
                    '<td><div class="user-cell-location"><i class="fas fa-map-marker-alt"></i> ' + escapeHtml(user.location || '-') + '</div></td>' +
                    '<td>' + statusBadge + '</td>' +
                    '<td><div class="user-cell-date">' + formatDate(user.joinDate) + '</div></td>' +
                    '<td><div class="user-actions">' +
                        '<button class="action-btn action-btn-info" title="View" onclick="viewUser(\'' + user.id + '\')"><i class="fas fa-eye"></i></button>' +
                        '<button class="action-btn action-btn-primary" title="Edit" onclick="editUser(\'' + user.id + '\')"><i class="fas fa-pen"></i></button>' +
                        (user.status === 'suspended'
                            ? '<button class="action-btn action-btn-primary" title="Activate" onclick="activateUser(\'' + user.id + '\')"><i class="fas fa-check-circle"></i></button>'
                            : '<button class="action-btn action-btn-warning" title="Suspend" onclick="openSuspendModal(\'' + user.id + '\')"><i class="fas fa-ban"></i></button>'
                        ) +
                        '<button class="action-btn action-btn-danger" title="Delete" onclick="deleteUser(\'' + user.id + '\')"><i class="fas fa-trash"></i></button>' +
                    '</div></td>' +
                '</tr>';
            });

            tbody.innerHTML = html;
        }

        function renderPagination() {
            var totalPages = Math.ceil(filteredUsers.length / pageSize);
            if (totalPages <= 0) totalPages = 1;
            if (currentPage > totalPages) currentPage = totalPages;

            var start = (currentPage - 1) * pageSize;
            var end = Math.min(start + pageSize, filteredUsers.length);

            document.getElementById('paginationInfo').textContent = 'Showing ' + (filteredUsers.length > 0 ? start + 1 : 0) + '-' + end + ' of ' + filteredUsers.length;

            var controls = '';
            controls += '<button class="pagination-btn" ' + (currentPage <= 1 ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage - 1) + ')"><i class="fas fa-chevron-left"></i></button>';

            var pages = getPageNumbers(currentPage, totalPages);
            pages.forEach(function(p) {
                if (p === '...') {
                    controls += '<span style="padding:0 4px;color:#94a3b8;">...</span>';
                } else {
                    controls += '<button class="pagination-btn' + (p === currentPage ? ' active' : '') + '" onclick="goToPage(' + p + ')">' + p + '</button>';
                }
            });

            controls += '<button class="pagination-btn" ' + (currentPage >= totalPages ? 'disabled' : '') + ' onclick="goToPage(' + (currentPage + 1) + ')"><i class="fas fa-chevron-right"></i></button>';

            document.getElementById('paginationControls').innerHTML = controls;
        }

        function getPageNumbers(current, total) {
            if (total <= 7) {
                var arr = [];
                for (var i = 1; i <= total; i++) arr.push(i);
                return arr;
            }
            var pages = [];
            pages.push(1);
            if (current > 3) pages.push('...');
            var start = Math.max(2, current - 1);
            var end = Math.min(total - 1, current + 1);
            for (var j = start; j <= end; j++) pages.push(j);
            if (current < total - 2) pages.push('...');
            pages.push(total);
            return pages;
        }

        function goToPage(page) {
            var totalPages = Math.ceil(filteredUsers.length / pageSize);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderUsersTable();
            renderPagination();
            document.querySelector('.users-table-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function viewUser(id) {
            var user = DB.users.find(function(u) { return u.id === id; });
            if (!user) return;

            document.getElementById('viewModalTitle').textContent = 'User Details';

            var businessCount = DB.businesses.filter(function(b) { return b.ownerId === id; }).length;
            var verifiedBadge = user.isVerified ? '<span class="badge badge-success">Verified</span>' : '<span class="badge badge-neutral">Unverified</span>';

            var html = '<div class="user-profile-section">' +
                '<img src="' + user.avatar + '" alt="' + escapeHtml(user.name) + '" class="user-profile-avatar" onerror="this.src=\'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=16a34a&color=fff&size=160\'">' +
                '<div class="user-profile-name">' + escapeHtml(user.name) + '</div>' +
                '<div class="user-profile-email">' + escapeHtml(user.email) + '</div>' +
                '<div class="user-profile-badges">' +
                    getRoleBadge(user.role) + ' ' +
                    getStatusBadge(user.status) + ' ' +
                    verifiedBadge +
                '</div>' +
            '</div>' +
            '<div class="user-detail-grid">' +
                '<div class="user-detail-item"><label>Full Name</label><span>' + escapeHtml(user.name) + '</span></div>' +
                '<div class="user-detail-item"><label>Email</label><span>' + escapeHtml(user.email) + '</span></div>' +
                '<div class="user-detail-item"><label>Phone</label><span>' + escapeHtml(user.phone) + '</span></div>' +
                '<div class="user-detail-item"><label>Location</label><span>' + escapeHtml(user.location || 'N/A') + '</span></div>' +
                '<div class="user-detail-item"><label>Role</label><span>' + user.role.replace('_', ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); }) + '</span></div>' +
                '<div class="user-detail-item"><label>Status</label><span>' + user.status.charAt(0).toUpperCase() + user.status.slice(1) + '</span></div>' +
                '<div class="user-detail-item"><label>Joined</label><span>' + formatDate(user.joinDate) + '</span></div>' +
                '<div class="user-detail-item"><label>Businesses</label><span>' + businessCount + '</span></div>' +
                (user.bio ? '<div class="user-detail-item user-detail-full"><label>Bio</label><span>' + escapeHtml(user.bio) + '</span></div>' : '') +
            '</div>';

            document.getElementById('viewModalBody').innerHTML = html;

            var footerHtml = '<button class="btn btn-secondary" onclick="closeViewModal()">Close</button>';
            if (user.status === 'suspended') {
                footerHtml += '<button class="btn btn-primary" onclick="closeViewModal();activateUser(\'' + user.id + '\')"><i class="fas fa-check-circle"></i> Activate</button>';
            } else {
                footerHtml += '<button class="btn btn-warning" onclick="closeViewModal();openSuspendModal(\'' + user.id + '\')"><i class="fas fa-ban"></i> Suspend</button>';
            }
            document.getElementById('viewModalFooter').innerHTML = footerHtml;

            document.getElementById('viewModal').classList.add('active');
        }

        function editUser(id) {
            var user = DB.users.find(function(u) { return u.id === id; });
            if (!user) return;

            document.getElementById('viewModalTitle').textContent = 'Edit User';

            var roleOptions = '<select id="editRole" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:var(--radius-sm);font-size:0.85rem;font-family:inherit;outline:none;color:var(--dark);">' +
                '<option value="admin"' + (user.role === 'admin' ? ' selected' : '') + '>Admin</option>' +
                '<option value="business_owner"' + (user.role === 'business_owner' ? ' selected' : '') + '>Business Owner</option>' +
                '<option value="customer"' + (user.role === 'customer' ? ' selected' : '') + '>Customer</option>' +
            '</select>';

            var statusOptions = '<select id="editStatus" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:var(--radius-sm);font-size:0.85rem;font-family:inherit;outline:none;color:var(--dark);">' +
                '<option value="active"' + (user.status === 'active' ? ' selected' : '') + '>Active</option>' +
                '<option value="inactive"' + (user.status === 'inactive' ? ' selected' : '') + '>Inactive</option>' +
                '<option value="suspended"' + (user.status === 'suspended' ? ' selected' : '') + '>Suspended</option>' +
            '</select>';

            var html = '<div class="user-profile-section">' +
                '<img src="' + user.avatar + '" alt="' + escapeHtml(user.name) + '" class="user-profile-avatar" onerror="this.src=\'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=16a34a&color=fff&size=160\'">' +
                '<div class="user-profile-name">' + escapeHtml(user.name) + '</div>' +
            '</div>' +
            '<div class="user-detail-grid">' +
                '<div class="user-detail-item"><label>Full Name</label><input type="text" id="editName" value="' + escapeHtml(user.name) + '" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:var(--radius-sm);font-size:0.85rem;font-family:inherit;outline:none;color:var(--dark);"></div>' +
                '<div class="user-detail-item"><label>Email</label><input type="email" id="editEmail" value="' + escapeHtml(user.email) + '" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:var(--radius-sm);font-size:0.85rem;font-family:inherit;outline:none;color:var(--dark);"></div>' +
                '<div class="user-detail-item"><label>Phone</label><input type="text" id="editPhone" value="' + escapeHtml(user.phone) + '" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:var(--radius-sm);font-size:0.85rem;font-family:inherit;outline:none;color:var(--dark);"></div>' +
                '<div class="user-detail-item"><label>Location</label><input type="text" id="editLocation" value="' + escapeHtml(user.location || '') + '" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:var(--radius-sm);font-size:0.85rem;font-family:inherit;outline:none;color:var(--dark);"></div>' +
                '<div class="user-detail-item"><label>Role</label>' + roleOptions + '</div>' +
                '<div class="user-detail-item"><label>Status</label>' + statusOptions + '</div>' +
                '<div class="user-detail-item user-detail-full"><label>Bio</label><textarea id="editBio" style="width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:var(--radius-sm);font-size:0.85rem;font-family:inherit;outline:none;color:var(--dark);resize:vertical;min-height:60px;">' + escapeHtml(user.bio || '') + '</textarea></div>' +
            '</div>';

            document.getElementById('viewModalBody').innerHTML = html;

            var footerHtml = '<button class="btn btn-secondary" onclick="closeViewModal()">Cancel</button>' +
                '<button class="btn btn-primary" onclick="saveUserEdit(\'' + user.id + '\')"><i class="fas fa-save"></i> Save Changes</button>';
            document.getElementById('viewModalFooter').innerHTML = footerHtml;

            document.getElementById('viewModal').classList.add('active');
        }

        function saveUserEdit(id) {
            var user = DB.users.find(function(u) { return u.id === id; });
            if (!user) return;

            var name = document.getElementById('editName').value.trim();
            var email = document.getElementById('editEmail').value.trim();
            var phone = document.getElementById('editPhone').value.trim();
            var location = document.getElementById('editLocation').value.trim();
            var role = document.getElementById('editRole').value;
            var status = document.getElementById('editStatus').value;
            var bio = document.getElementById('editBio').value.trim();

            if (!name || !email) {
                showToast('Name and email are required.');
                return;
            }

            user.name = name;
            user.email = email;
            user.phone = phone;
            user.location = location;
            user.role = role;
            user.status = status;
            user.bio = bio;

            closeViewModal();
            updateFilterCounts();
            applyFilters();
            showToast('User "' + user.name + '" has been updated successfully.');
        }

        function openSuspendModal(id) {
            var user = DB.users.find(function(u) { return u.id === id; });
            if (!user) return;

            pendingSuspendUserId = id;
            document.getElementById('suspendUserName').textContent = user.name;
            document.getElementById('suspendReason').value = '';
            document.getElementById('suspendModal').classList.add('active');
        }

        function closeSuspendModal() {
            document.getElementById('suspendModal').classList.remove('active');
            pendingSuspendUserId = null;
        }

        function confirmSuspend() {
            if (!pendingSuspendUserId) return;

            var user = DB.users.find(function(u) { return u.id === pendingSuspendUserId; });
            if (!user) return;

            user.status = 'suspended';
            closeSuspendModal();
            updateFilterCounts();
            applyFilters();
            showToast('User "' + user.name + '" has been suspended.');
        }

        function activateUser(id) {
            var user = DB.users.find(function(u) { return u.id === id; });
            if (!user) return;

            user.status = 'active';
            updateFilterCounts();
            applyFilters();
            showToast('User "' + user.name + '" has been activated.');
        }

        function deleteUser(id) {
            var user = DB.users.find(function(u) { return u.id === id; });
            if (!user) return;

            if (!confirm('Are you sure you want to permanently delete "' + user.name + '"? This action cannot be undone.')) return;

            var index = DB.users.indexOf(user);
            if (index !== -1) {
                DB.users.splice(index, 1);
            }

            updateFilterCounts();
            applyFilters();
            showToast('User "' + user.name + '" has been deleted.');
        }

        function getRoleBadge(role) {
            var map = {
                admin: 'badge-danger',
                business_owner: 'badge-info',
                customer: 'badge-success'
            };
            var label = role.replace('_', ' ');
            label = label.replace(/\b\w/g, function(c) { return c.toUpperCase(); });
            return '<span class="badge ' + (map[role] || 'badge-neutral') + '">' + label + '</span>';
        }

        function getStatusBadge(status) {
            var map = {
                active: 'badge-success',
                pending: 'badge-warning',
                inactive: 'badge-neutral',
                suspended: 'badge-danger'
            };
            var label = status.charAt(0).toUpperCase() + status.slice(1);
            return '<span class="badge ' + (map[status] || 'badge-neutral') + '">' + label + '</span>';
        }

        function formatDate(dateStr) {
            var d = new Date(dateStr);
            var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
        }

        function escapeHtml(str) {
            if (!str) return '';
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function showToast(message) {
            var existing = document.querySelector('.toast-notification');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.textContent = message;
            toast.style.cssText = 'position:fixed;bottom:30px;right:30px;background:#1e3a5f;color:#fff;padding:14px 24px;border-radius:12px;z-index:10000;font-size:0.9rem;box-shadow:0 4px 20px rgba(0,0,0,0.25);animation:slideIn 0.3s ease;';
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(function() { toast.remove(); }, 300);
            }, 2500);
        }
    </script>
</body>
</html>
