<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Kuje Connect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-body { background: #f1f5f9; }
        .admin-stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }
        .admin-stat-card {
            background: #fff;
            border-radius: var(--radius);
            padding: 22px;
            display: flex;
            align-items: flex-start;
            gap: 16px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.04);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
        }
        .admin-stat-card.animate-in {
            opacity: 1;
            transform: translateY(0);
        }
        .admin-stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .stat-info {
            flex: 1;
            min-width: 0;
        }
        .stat-info h3 {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--dark);
            line-height: 1.2;
            margin-bottom: 4px;
        }
        .stat-info p {
            font-size: 0.82rem;
            color: var(--gray);
            font-weight: 500;
        }
        .stat-trend {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 50px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .stat-trend.up {
            color: #16a34a;
            background: rgba(22,163,74,0.08);
        }
        .stat-trend.down {
            color: #dc2626;
            background: rgba(220,38,38,0.08);
        }
        .stat-trend i {
            font-size: 0.65rem;
            margin-right: 2px;
        }
        .admin-charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        .admin-chart-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.04);
            padding: 22px;
        }
        .admin-chart-card h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 20px;
        }
        .chart-bars {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 180px;
            padding-top: 10px;
        }
        .chart-bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            height: 100%;
            justify-content: flex-end;
        }
        .chart-bar {
            width: 100%;
            max-width: 36px;
            border-radius: 6px 6px 0 0;
            transition: height 0.8s cubic-bezier(0.4,0,0.2,1);
            position: relative;
            cursor: pointer;
            min-height: 4px;
        }
        .chart-bar:hover {
            filter: brightness(1.1);
        }
        .chart-bar .bar-tooltip {
            display: none;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
        }
        .chart-bar:hover .bar-tooltip {
            display: block;
        }
        .chart-bar-label {
            font-size: 0.68rem;
            color: var(--gray);
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 60px;
        }
        .admin-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }
        .admin-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.04);
            overflow: hidden;
        }
        .admin-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 22px;
            border-bottom: 1px solid var(--gray-lighter);
        }
        .admin-card-header h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--dark);
        }
        .admin-list-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 22px;
            border-bottom: 1px solid var(--gray-lighter);
            transition: background 0.2s;
        }
        .admin-list-item:last-child {
            border-bottom: none;
        }
        .admin-list-item:hover {
            background: rgba(22,163,74,0.02);
        }
        .admin-list-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }
        .admin-list-info {
            flex: 1;
            min-width: 0;
        }
        .admin-list-name {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .admin-list-meta {
            font-size: 0.78rem;
            color: var(--gray);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .admin-list-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }
        .admin-list-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray);
        }
        .admin-list-empty i {
            font-size: 2rem;
            color: var(--gray-lighter);
            margin-bottom: 8px;
            display: block;
        }
        .admin-list-empty p {
            font-size: 0.85rem;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
        }
        .badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        .badge-success {
            background: rgba(22,163,74,0.1);
            color: #16a34a;
        }
        .badge-warning {
            background: rgba(234,179,8,0.12);
            color: #ca8a04;
        }
        .badge-danger {
            background: rgba(220,38,38,0.1);
            color: #dc2626;
        }
        .badge-info {
            background: rgba(59,130,246,0.1);
            color: #2563eb;
        }
        .badge-neutral {
            background: #f1f5f9;
            color: #64748b;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.78rem;
            font-weight: 600;
            border-radius: var(--radius-xs);
            border: 1.5px solid var(--gray-lighter);
            background: #fff;
            color: var(--dark);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn-sm:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-outline {
            background: transparent;
            color: var(--dark);
            border: 1.5px solid var(--gray-lighter);
            padding: 6px 14px;
            font-size: 0.78rem;
            font-weight: 600;
            border-radius: var(--radius-xs);
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .action-btn {
            padding: 5px 10px;
            font-size: 0.72rem;
            font-weight: 600;
            border-radius: var(--radius-xs);
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        .action-btn-primary {
            background: rgba(22,163,74,0.1);
            color: #16a34a;
        }
        .action-btn-primary:hover {
            background: #16a34a;
            color: #fff;
        }
        .action-btn-danger {
            background: rgba(220,38,38,0.1);
            color: #dc2626;
        }
        .action-btn-danger:hover {
            background: #dc2626;
            color: #fff;
        }
        @media (max-width: 1024px) {
            .admin-stats-grid { grid-template-columns: repeat(2, 1fr); }
            .admin-charts-grid { grid-template-columns: 1fr; }
            .admin-grid-2 { grid-template-columns: 1fr; }
        }
        @media (max-width: 640px) {
            .admin-stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="admin-body">
    <!-- header placeholder -->
    <div id="admin-header"></div>

    <main class="admin-main">
        <!-- Stats Grid -->
        <div class="admin-stats-grid">
            <div class="admin-stat-card">
                <div class="stat-icon" style="background:#dcfce7;color:#16a34a;"><i class="fas fa-users"></i></div>
                <div class="stat-info"><h3 id="statUsers">0</h3><p>Total Users</p></div>
                <span class="stat-trend up"><i class="fas fa-arrow-up"></i> 12%</span>
            </div>
            <div class="admin-stat-card">
                <div class="stat-icon" style="background:#dbeafe;color:#2563eb;"><i class="fas fa-store"></i></div>
                <div class="stat-info"><h3 id="statBusinesses">0</h3><p>Businesses</p></div>
                <span class="stat-trend up"><i class="fas fa-arrow-up"></i> 8%</span>
            </div>
            <div class="admin-stat-card">
                <div class="stat-icon" style="background:#fef3c7;color:#d97706;"><i class="fas fa-box"></i></div>
                <div class="stat-info"><h3 id="statProducts">0</h3><p>Products</p></div>
                <span class="stat-trend up"><i class="fas fa-arrow-up"></i> 5%</span>
            </div>
            <div class="admin-stat-card">
                <div class="stat-icon" style="background:#fce7f3;color:#db2777;"><i class="fas fa-flag"></i></div>
                <div class="stat-info"><h3 id="statReports">0</h3><p>Pending Reports</p></div>
                <span class="stat-trend down"><i class="fas fa-arrow-down"></i> 3%</span>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="admin-charts-grid">
            <div class="admin-chart-card">
                <h3>User Signups (Monthly)</h3>
                <div class="chart-bars" id="signupsChart"></div>
            </div>
            <div class="admin-chart-card">
                <h3>Businesses by Category</h3>
                <div class="chart-bars" id="categoryChart"></div>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="admin-grid-2">
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3>Recent Users</h3>
                    <a href="users.html" class="btn-outline">View All</a>
                </div>
                <div id="recentUsers"></div>
            </div>
            <div class="admin-card">
                <div class="admin-card-header">
                    <h3>Pending Businesses</h3>
                    <a href="businesses.html" class="btn-outline">View All</a>
                </div>
                <div id="pendingBusinesses"></div>
            </div>
        </div>

        <!-- Recent Reports -->
        <div class="admin-card">
            <div class="admin-card-header">
                <h3>Recent Reports</h3>
                <a href="reports.html" class="btn-outline">View All</a>
            </div>
            <div id="recentReports"></div>
        </div>
    </main>

    <!-- footer placeholder -->
    <div id="admin-footer"></div>

    <script src="../data/data.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadAdminPartials();
            animateStatCards();

            var stats = getStats();
            document.getElementById('statUsers').textContent = stats.totalUsers;
            document.getElementById('statBusinesses').textContent = stats.totalBusinesses;
            document.getElementById('statProducts').textContent = stats.totalProducts;
            document.getElementById('statReports').textContent = stats.pendingReports;

            renderRecentUsers();
            renderPendingBusinesses();
            renderRecentReports();
            renderSignupsChart();
            renderCategoryChart();
        });

        function loadAdminPartials() {
            fetch('includes/admin-header.html')
                .then(function(r) { return r.text(); })
                .then(function(h) {
                    document.getElementById('admin-header').innerHTML = h;
                    if (typeof initAdminSidebar === 'function') initAdminSidebar();
                });
            fetch('includes/admin-footer.html')
                .then(function(r) { return r.text(); })
                .then(function(h) {
                    document.getElementById('admin-footer').innerHTML = h;
                });
        }

        function animateStatCards() {
            var cards = document.querySelectorAll('.admin-stat-card');
            cards.forEach(function(card, i) {
                setTimeout(function() {
                    card.classList.add('animate-in');
                }, i * 120);
            });
        }

        function getStats() {
            return {
                totalUsers: DB.users.length,
                totalBusinesses: DB.businesses.length,
                totalProducts: DB.products.length,
                pendingReports: DB.reports.filter(function(r) { return r.status === 'pending'; }).length
            };
        }

        function getRoleBadge(role) {
            var map = {
                admin: 'badge-danger',
                business_owner: 'badge-info',
                customer: 'badge-success'
            };
            var label = role.replace('_', ' ');
            return '<span class="badge ' + (map[role] || 'badge-neutral') + '">' + label + '</span>';
        }

        function getStatusBadge(status) {
            var map = {
                active: 'badge-success',
                pending: 'badge-warning',
                inactive: 'badge-neutral',
                suspended: 'badge-danger',
                resolved: 'badge-success',
                dismissed: 'badge-neutral'
            };
            return '<span class="badge ' + (map[status] || 'badge-neutral') + '">' + status.charAt(0).toUpperCase() + status.slice(1) + '</span>';
        }

        function formatDate(dateStr) {
            var d = new Date(dateStr);
            var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
        }

        function timeAgo(dateStr) {
            var now = new Date();
            var d = new Date(dateStr);
            var diff = Math.floor((now - d) / 1000);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            if (diff < 2592000) return Math.floor(diff / 86400) + 'd ago';
            return formatDate(dateStr);
        }

        function renderRecentUsers() {
            var container = document.getElementById('recentUsers');
            var users = DB.users.slice().sort(function(a, b) {
                return new Date(b.joinDate) - new Date(a.joinDate);
            }).slice(0, 6);

            if (users.length === 0) {
                container.innerHTML = '<div class="admin-list-empty"><i class="fas fa-users"></i><p>No users found</p></div>';
                return;
            }

            var html = '';
            users.forEach(function(user) {
                html += '<div class="admin-list-item">' +
                    '<img src="' + user.avatar + '" alt="' + user.name + '" class="admin-list-avatar" onerror="this.src=\'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=16a34a&color=fff&size=76\'">' +
                    '<div class="admin-list-info">' +
                        '<div class="admin-list-name">' + user.name + '</div>' +
                        '<div class="admin-list-meta">' + getRoleBadge(user.role) + ' &middot; ' + formatDate(user.joinDate) + '</div>' +
                    '</div>' +
                    '<div class="admin-list-actions">' +
                        getStatusBadge(user.status) +
                    '</div>' +
                '</div>';
            });
            container.innerHTML = html;
        }

        function renderPendingBusinesses() {
            var container = document.getElementById('pendingBusinesses');
            var pending = DB.businesses.filter(function(b) {
                return b.status === 'pending' || !b.verified;
            }).slice(0, 6);

            if (pending.length === 0) {
                container.innerHTML = '<div class="admin-list-empty"><i class="fas fa-check-circle"></i><p>All businesses are approved</p></div>';
                return;
            }

            var html = '';
            pending.forEach(function(biz) {
                var owner = DB.users.find(function(u) { return u.id === biz.ownerId; });
                var ownerName = owner ? owner.name : 'Unknown';
                var catName = biz.category.replace(/-/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });

                html += '<div class="admin-list-item">' +
                    '<div class="stat-icon" style="background:#dbeafe;color:#2563eb;width:38px;height:38px;font-size:0.95rem;border-radius:50%;">' +
                        '<i class="fas fa-store"></i>' +
                    '</div>' +
                    '<div class="admin-list-info">' +
                        '<div class="admin-list-name">' + biz.name + '</div>' +
                        '<div class="admin-list-meta">' + ownerName + ' &middot; ' + catName + '</div>' +
                    '</div>' +
                    '<div class="admin-list-actions">' +
                        '<button class="action-btn action-btn-primary" onclick="approveBusiness(\'' + biz.id + '\')"><i class="fas fa-check"></i> Approve</button>' +
                        '<button class="action-btn action-btn-danger" onclick="rejectBusiness(\'' + biz.id + '\')"><i class="fas fa-times"></i> Reject</button>' +
                    '</div>' +
                '</div>';
            });
            container.innerHTML = html;
        }

        function approveBusiness(id) {
            var biz = DB.businesses.find(function(b) { return b.id === id; });
            if (biz) {
                biz.status = 'active';
                biz.verified = true;
                renderPendingBusinesses();
                showToast('Business "' + biz.name + '" has been approved.');
            }
        }

        function rejectBusiness(id) {
            var biz = DB.businesses.find(function(b) { return b.id === id; });
            if (biz) {
                biz.status = 'rejected';
                renderPendingBusinesses();
                showToast('Business "' + biz.name + '" has been rejected.');
            }
        }

        function renderRecentReports() {
            var container = document.getElementById('recentReports');
            var reports = DB.reports.slice().sort(function(a, b) {
                return new Date(b.dateReported) - new Date(a.dateReported);
            }).slice(0, 6);

            if (reports.length === 0) {
                container.innerHTML = '<div class="admin-list-empty"><i class="fas fa-flag"></i><p>No reports found</p></div>';
                return;
            }

            var html = '';
            reports.forEach(function(report) {
                var reporter = DB.users.find(function(u) { return u.id === report.reporterId; });
                var reporterName = reporter ? reporter.name : 'Unknown';

                var targetName = '';
                if (report.targetType === 'business') {
                    var biz = DB.businesses.find(function(b) { return b.id === report.targetId; });
                    targetName = biz ? biz.name : report.targetId;
                } else if (report.targetType === 'product') {
                    var prod = DB.products.find(function(p) { return p.id === report.targetId; });
                    targetName = prod ? prod.name : report.targetId;
                } else if (report.targetType === 'user') {
                    var usr = DB.users.find(function(u) { return u.id === report.targetId; });
                    targetName = usr ? usr.name : report.targetId;
                }

                var typeIcon = 'fa-flag';
                if (report.targetType === 'business') typeIcon = 'fa-store';
                else if (report.targetType === 'product') typeIcon = 'fa-box';
                else if (report.targetType === 'user') typeIcon = 'fa-user';

                var typeColorBg = '#fce7f3';
                var typeColorFg = '#db2777';
                if (report.targetType === 'business') { typeColorBg = '#dbeafe'; typeColorFg = '#2563eb'; }
                else if (report.targetType === 'product') { typeColorBg = '#fef3c7'; typeColorFg = '#d97706'; }

                html += '<div class="admin-list-item">' +
                    '<div class="stat-icon" style="background:' + typeColorBg + ';color:' + typeColorFg + ';width:38px;height:38px;font-size:0.85rem;border-radius:50%;">' +
                        '<i class="fas ' + typeIcon + '"></i>' +
                    '</div>' +
                    '<div class="admin-list-info">' +
                        '<div class="admin-list-name">' + reporterName + ' reported ' + targetName + '</div>' +
                        '<div class="admin-list-meta">' + report.reason + ' &middot; ' + timeAgo(report.dateReported) + '</div>' +
                    '</div>' +
                    '<div class="admin-list-actions">' +
                        getStatusBadge(report.status) +
                    '</div>' +
                '</div>';
            });
            container.innerHTML = html;
        }

        function renderSignupsChart() {
            var container = document.getElementById('signupsChart');
            var monthCounts = {};
            var monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

            DB.users.forEach(function(u) {
                var d = new Date(u.joinDate);
                var key = d.getFullYear() + '-' + (d.getMonth() + 1);
                if (!monthCounts[key]) monthCounts[key] = 0;
                monthCounts[key]++;
            });

            var sorted = Object.keys(monthCounts).sort();
            var last6 = sorted.slice(-6);

            if (last6.length === 0) {
                container.innerHTML = '<div class="admin-list-empty"><p>No data available</p></div>';
                return;
            }

            var maxVal = 0;
            last6.forEach(function(k) {
                if (monthCounts[k] > maxVal) maxVal = monthCounts[k];
            });
            if (maxVal === 0) maxVal = 1;

            var colors = ['#16a34a','#22c55e','#34d399','#6ee7b7','#a7f3d0','#d1fae5'];
            var html = '';
            last6.forEach(function(key, i) {
                var parts = key.split('-');
                var month = monthNames[parseInt(parts[1]) - 1];
                var count = monthCounts[key];
                var pct = Math.max((count / maxVal) * 100, 4);
                var color = colors[i % colors.length];

                html += '<div class="chart-bar-group">' +
                    '<div class="chart-bar" style="height:' + pct + '%;background:' + color + ';">' +
                        '<span class="bar-tooltip">' + month + ': ' + count + ' users</span>' +
                    '</div>' +
                    '<span class="chart-bar-label">' + month + '</span>' +
                '</div>';
            });
            container.innerHTML = html;

            setTimeout(function() {
                container.querySelectorAll('.chart-bar').forEach(function(bar) {
                    var h = bar.style.height;
                    bar.style.height = '4px';
                    requestAnimationFrame(function() {
                        requestAnimationFrame(function() {
                            bar.style.height = h;
                        });
                    });
                });
            }, 100);
        }

        function renderCategoryChart() {
            var container = document.getElementById('categoryChart');
            var catCounts = {};

            DB.businesses.forEach(function(b) {
                if (!catCounts[b.category]) catCounts[b.category] = 0;
                catCounts[b.category]++;
            });

            var sorted = Object.entries(catCounts).sort(function(a, b) {
                return b[1] - a[1];
            }).slice(0, 7);

            if (sorted.length === 0) {
                container.innerHTML = '<div class="admin-list-empty"><p>No data available</p></div>';
                return;
            }

            var maxVal = sorted[0][1];
            if (maxVal === 0) maxVal = 1;

            var colors = ['#2563eb','#3b82f6','#60a5fa','#93c5fd','#16a34a','#22c55e','#34d399'];
            var html = '';
            sorted.forEach(function(entry, i) {
                var slug = entry[0];
                var count = entry[1];
                var label = slug.replace(/-/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
                if (label.length > 12) label = label.substring(0, 11) + '…';
                var pct = Math.max((count / maxVal) * 100, 4);

                html += '<div class="chart-bar-group">' +
                    '<div class="chart-bar" style="height:' + pct + '%;background:' + colors[i % colors.length] + ';">' +
                        '<span class="bar-tooltip">' + label + ': ' + count + '</span>' +
                    '</div>' +
                    '<span class="chart-bar-label">' + label + '</span>' +
                '</div>';
            });
            container.innerHTML = html;

            setTimeout(function() {
                container.querySelectorAll('.chart-bar').forEach(function(bar) {
                    var h = bar.style.height;
                    bar.style.height = '4px';
                    requestAnimationFrame(function() {
                        requestAnimationFrame(function() {
                            bar.style.height = h;
                        });
                    });
                });
            }, 100);
        }

        function showToast(message) {
            var existing = document.querySelector('.toast-notification');
            if (existing) existing.remove();
            var toast = document.createElement('div');
            toast.className = 'toast-notification';
            toast.textContent = message;
            toast.style.cssText = 'position:fixed;bottom:30px;right:30px;background:#1e3a5f;color:#fff;padding:14px 24px;border-radius:12px;z-index:10000;font-size:0.9rem;box-shadow:0 4px 20px rgba(0,0,0,0.25);animation:toastIn 0.3s ease;';
            document.body.appendChild(toast);
            setTimeout(function() {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(function() { toast.remove(); }, 300);
            }, 2500);
        }
    </script>
</body>
</html>
