<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Businesses - Kuje Connect Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-body { background: #f1f5f9; }
        .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
        .page-header h1 { font-size:1.5rem; font-weight:700; color:var(--dark); }
        .page-header h1 i { margin-right:8px; color:var(--primary); }
        .filter-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
        .filter-tab { padding:7px 18px; font-size:0.83rem; font-weight:600; border-radius:50px; border:1.5px solid var(--gray-lighter); background:#fff; color:var(--gray); cursor:pointer; transition:all 0.2s; white-space:nowrap; }
        .filter-tab:hover { border-color:var(--primary); color:var(--primary); }
        .filter-tab.active { background:var(--primary); border-color:var(--primary); color:#fff; }
        .search-box { display:flex; align-items:center; background:#fff; border:1.5px solid var(--gray-lighter); border-radius:50px; padding:0 16px; margin-left:auto; flex:0 1 300px; }
        .search-box i { color:var(--gray-lighter); font-size:0.9rem; flex-shrink:0; }
        .search-box input { border:none; outline:none; padding:9px 12px; font-size:0.85rem; width:100%; background:transparent; font-family:inherit; }
        .table-wrap { background:#fff; border-radius:var(--radius); box-shadow:var(--shadow); overflow-x:auto; border:1px solid rgba(0,0,0,0.04); }
        .admin-table { width:100%; border-collapse:collapse; font-size:0.85rem; }
        .admin-table thead { background:#fafbfc; }
        .admin-table th { padding:14px 16px; text-align:left; font-weight:600; font-size:0.78rem; letter-spacing:0.5px; text-transform:uppercase; color:var(--gray); border-bottom:1px solid var(--gray-lighter); white-space:nowrap; }
        .admin-table td { padding:14px 16px; border-bottom:1px solid var(--gray-lighter); vertical-align:middle; }
        .admin-table tbody tr { transition:background 0.12s; }
        .admin-table tbody tr:hover { background:rgba(22,163,74,0.02); }
        .table-img { width:40px; height:40px; border-radius:8px; object-fit:cover; display:block; }
        .table-business-name { font-weight:600; color:var(--dark); }
        .table-meta-sm { font-size:0.75rem; color:var(--gray); margin-top:2px; }
        .stars { display:inline-flex; gap:1px; color:#eab308; font-size:0.85rem; }
        .stars .empty { color:#d1d5db; }
        .star-rating-text { font-size:0.78rem; color:var(--gray); margin-left:4px; }
        .action-btns { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
        .action-badge-btn { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; font-size:0.72rem; font-weight:600; border:none; border-radius:4px; cursor:pointer; transition:all 0.2s; white-space:nowrap; }
        .action-badge-btn i { font-size:0.65rem; }
        .action-badge-green { background:rgba(22,163,74,0.1); color:#16a34a; }
        .action-badge-green:hover { background:#16a34a; color:#fff; }
        .action-badge-orange { background:rgba(234,179,8,0.15); color:#ca8a04; }
        .action-badge-orange:hover { background:#ca8a04; color:#fff; }
        .action-badge-red { background:rgba(220,38,38,0.1); color:#dc2626; }
        .action-badge-red:hover { background:#dc2626; color:#fff; }
        .action-badge-blue { background:rgba(59,130,246,0.1); color:#2563eb; }
        .action-badge-blue:hover { background:#2563eb; color:#fff; }
        .action-badge-gray { background:rgba(100,116,139,0.12); color:#64748b; }
        .action-badge-gray:hover { background:#64748b; color:#fff; }
        .featured-toggle { display:inline-flex; width:38px; height:22px; border-radius:50px; border:none; cursor:pointer; position:relative; transition:all 0.3s; padding:0; align-items:center; }
        .featured-toggle::after { content:''; position:absolute; top:3px; width:16px; height:16px; background:#fff; border-radius:50%; transition:all 0.3s; }
        .featured-toggle.on { background:#16a34a; }
        .featured-toggle.on::after { left:calc(100% - 19px); }
        .featured-toggle.off { background:#d1d5db; }
        .featured-toggle.off::after { left:3px; }
        .pagination-wrap { display:flex; justify-content:center; padding:20px; gap:4px; flex-wrap:wrap; }
        .pagination-wrap button { padding:6px 12px; font-size:0.8rem; font-weight:600; border:1.5px solid var(--gray-lighter); border-radius:6px; background:#fff; color:var(--dark); cursor:pointer; transition:all 0.15s; }
        .pagination-wrap button:hover { border-color:var(--primary); color:var(--primary); }
        .pagination-wrap button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .pagination-wrap button:disabled { opacity:0.5; cursor:not-allowed; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:10000; display:none; align-items:center; justify-content:center; padding:20px; }
        .modal-overlay.open { display:flex; }
        .modal-box { background:#fff; width:100%; max-width:700px; max-height:85vh; border-radius:var(--radius); overflow:hidden; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,0.2); }
        .modal-header { display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid var(--gray-lighter); flex-shrink:0; }
        .modal-header h2 { font-size:1.15rem; font-weight:700; color:var(--dark); }
        .modal-close { background:none; border:none; font-size:1.5rem; color:var(--gray); cursor:pointer; padding:0; line-height:1; }
        .modal-close:hover { color:var(--dark); }
        .modal-body { padding:22px; overflow-y:auto; flex:1; }
        .modal-footer { padding:16px 22px; border-top:1px solid var(--gray-lighter); text-align:right; flex-shrink:0; }
        .detail-group { margin-bottom:12px; }
        .detail-group label { font-size:0.72rem; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:var(--gray); display:block; margin-bottom:3px; }
        .detail-group .detail-value { font-size:0.93rem; color:var(--dark); }
        .img-gallery { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
        .img-gallery img { width:140px; height:100px; object-fit:cover; border-radius:8px; cursor:pointer; transition:transform 0.2s; }
        .img-gallery img:hover { transform:scale(1.02); }
        .review-item { padding:10px 0; border-bottom:1px solid var(--gray-lighter); }
        .review-item:last-child { border-bottom:none; }
        .review-stars { color:#eab308; font-size:0.85rem; }
        .review-reply { font-size:0.8rem; padding:6px 10px; background:#f9fafb; border-radius:6px; margin-top:4px; color:var(--dark); border-left:3px solid var(--primary); }
        .review-reply strong { font-size:0.72rem; text-transform:uppercase; display:block; margin-bottom:2px; color:var(--gray); }
        .inline-edit { width:100%; padding:6px 8px; font-size:0.9rem; border:1.5px solid var(--gray-lighter); border-radius:6px; font-family:inherit; outline:none; transition:border-color 0.2s; }
        .inline-edit:focus { border-color:var(--primary); }
        .modal-select { width:100%; padding:6px 8px; font-size:0.9rem; border:1.5px solid var(--gray-lighter); border-radius:6px; font-family:inherit; outline:none; transition:border 0.2s; background:#fff; cursor:pointer; }
        .modal-select:focus { border-color:var(--primary); }
        .inline-edit-textarea { width:100%; padding:6px 8px; font-size:0.9rem; border:1.5px solid var(--gray-lighter); border-radius:6px; font-family:inherit; outline:none; transition:border-color 0.2s; resize:vertical; min-height:60px; }
        .inline-edit-textarea:focus { border-color:var(--primary); }
        .table-badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:50px; font-size:0.72rem; font-weight:600; }
        .table-badge::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
        .table-badge.active { background:rgba(22,163,74,0.1); color:#16a34a; }
        .table-badge.pending { background:rgba(234,179,8,0.12); color:#ca8a04; }
        .table-badge.suspended { background:rgba(220,38,38,0.1); color:#dc2626; }
        .btn-sm { padding:6px 14px; font-size:0.78rem; font-weight:600; border-radius:var(--radius-xs); border:1.5px solid var(--gray-lighter); background:#fff; color:var(--dark); cursor:pointer; transition:all 0.2s; }
        .btn-sm:hover { border-color:var(--primary); color:var(--primary); }
        .btn-primary { background:var(--primary); color:#fff; border:1.5px solid var(--primary); }
        .btn-primary:hover { background:#155e2d; border-color:#155e2d; color:#fff; }
        .empty-state { text-align:center; padding:60px 20px; color:var(--gray); }
        .empty-state i { font-size:2.5rem; color:var(--gray-lighter); margin-bottom:12px; display:block; }
        .empty-state p { font-size:0.95rem; }
        @media (max-width:768px) { .page-header{flex-direction:column;align-items:stretch;gap:12px} .search-box{flex:1} .admin-table{font-size:0.78rem} .action-btns{flex-direction:column;align-items:stretch} .action-badge-btn{justify-content:center} }
    </style>
</head>
<body class="admin-body">
    <div id="admin-header"></div>
    <main class="admin-main">
        <div class="page-header"><h1><i class="fas fa-store"></i> Manage Businesses</h1></div>
        <div class="filter-bar">
            <button class="filter-tab active" data-filter="all">All</button>
            <button class="filter-tab" data-filter="active">Active</button>
            <button class="filter-tab" data-filter="pending">Pending</button>
            <button class="filter-tab" data-filter="suspended">Suspended</button>
            <button class="filter-tab" data-filter="featured">Featured</button>
            <div class="search-box"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="Search businesses..." autocomplete="off"></div>
        </div>
        <div class="table-wrap">
            <table class="admin-table">
                <thead><tr>
                    <th>Image</th><th>Business Name</th><th>Owner</th><th>Category</th><th>Location</th><th>Rating</th><th>Status</th><th>Featured</th><th>Actions</th>
                </tr></thead>
                <tbody id="tableBody"><tr><td colspan="9"><div class="empty-state"><i class="fas fa-store"></i><p>Loading...</p></div></td></tr></tbody>
            </table>
            <div class="pagination-wrap" id="paginationWrap"></div>
        </div>
    </main>
    <div id="admin-footer"></div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-box" style="max-width:750px;">
            <div class="modal-header"><h2><i class="fas fa-store"></i> Business Details</h2><button class="modal-close" onclick="closeDetailModal()">&times;</button></div>
            <div class="modal-body">
                <div class="detail-group"><label>Name</label><div id="dName" class="detail-value"></div></div>
                <div class="detail-group"><label>Owner</label><div id="dOwner" class="detail-value"></div></div>
                <div class="detail-group"><label>Category</label><div id="dCategory" class="detail-value"></div></div>
                <div class="detail-group"><label>Subcategory</label><div id="dSubcategory" class="detail-value"></div></div>
                <div class="detail-group"><label>Description</label><div id="dDescription" class="detail-value"></div></div>
                <div class="detail-group"><label>Location</label><div id="dLocation" class="detail-value"></div></div>
                <div class="detail-group"><label>Address</label><div id="dAddress" class="detail-value"></div></div>
                <div class="detail-group"><label>Phone</label><div id="dPhone" class="detail-value"></div></div>
                <div class="detail-group"><label>Email</label><div id="dEmail" class="detail-value"></div></div>
                <div class="detail-group"><label>Website</label><div id="dWebsite" class="detail-value"></div></div>
                <div class="detail-group"><label>Opening Hours</label><div id="dHours" class="detail-value"></div></div>
                <div class="detail-group"><label>Rating</label><div id="dRating" class="detail-value"></div></div>
                <div class="detail-group"><label>Date Added</label><div id="dDate" class="detail-value"></div></div>
                <div class="detail-group"><label>Images</label><div id="dImages" class="img-gallery"></div></div>
                <div class="detail-group"><label>Reviews (<span id="dReviewCount">0</span>)</label><div id="dReviews"></div></div>
            </div>
            <div class="modal-footer"><button class="btn-sm" onclick="closeDetailModal()">Close</button></div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box" style="max-width:650px;">
            <div class="modal-header"><h2><i class="fas fa-pen"></i> Edit Business</h2><button class="modal-close" onclick="closeEditModal()">&times;</button></div>
            <div class="modal-body">
                <div class="detail-group"><label>Business Name</label><input class="inline-edit" id="eName" type="text"></div>
                <div class="detail-group"><label>Description</label><textarea class="inline-edit-textarea" id="eDescription"></textarea></div>
                <div class="detail-group"><label>Category</label><select class="modal-select" id="eCategory"></select></div>
                <div class="detail-group"><label>Subcategory</label><input class="inline-edit" id="eSubcategory" type="text"></div>
                <div class="detail-group"><label>Status</label><select class="modal-select" id="eStatus"><option value="active">Active</option><option value="pending">Pending</option><option value="suspended">Suspended</option></select></div>
                <div class="detail-group"><label>Location</label><input class="inline-edit" id="eLocation" type="text"></div>
                <div class="detail-group"><label>Address</label><input class="inline-edit" id="eAddress" type="text"></div>
                <div class="detail-group"><label>Phone</label><input class="inline-edit" id="ePhone" type="text"></div>
                <div class="detail-group"><label>Email</label><input class="inline-edit" id="eEmail" type="email"></div>
            </div>
            <div class="modal-footer"><button class="btn-sm" onclick="closeEditModal()">Cancel</button><button class="btn-sm btn-primary" onclick="saveEditBusiness()">Save Changes</button></div>
        </div>
    </div>

    <script src="../data/data.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        var FILTER = 'all', SEARCH = '', PAGE = 1, PER_PAGE = 10, editBizId = null;
        document.addEventListener('DOMContentLoaded', function() { loadPartials(); renderTable(); setupFilterTabs(); setupSearch(); });

        function loadPartials() {
            fetch('includes/admin-header.html').then(function(r){return r.text();}).then(function(h){
                document.getElementById('admin-header').innerHTML = h;
                if (typeof initAdminSidebar === 'function') initAdminSidebar();
                if (typeof initAdminDropdown === 'function') initAdminDropdown();
            });
            fetch('includes/admin-footer.html').then(function(r){return r.text();}).then(function(h){document.getElementById('admin-footer').innerHTML = h;});
        }

        function setupFilterTabs() {
            document.querySelectorAll('.filter-tab').forEach(function(t){
                t.addEventListener('click', function(){
                    document.querySelectorAll('.filter-tab').forEach(function(x){x.classList.remove('active');});
                    this.classList.add('active'); FILTER = this.dataset.filter; PAGE = 1; renderTable();
                });
            });
        }

        function setupSearch() {
            var timer = null;
            document.getElementById('searchInput').addEventListener('keyup', function(){
                if (timer) clearTimeout(timer);
                timer = setTimeout(function(){ SEARCH = document.getElementById('searchInput').value.trim().toLowerCase(); PAGE = 1; renderTable(); }, 300);
            });
        }

        function getFiltered() {
            var list = DB.businesses.slice();
            if (FILTER === 'featured') list = list.filter(function(b){return b.featured;});
            else if (FILTER !== 'all') list = list.filter(function(b){return b.status === FILTER;});
            if (SEARCH) {
                var s = SEARCH;
                list = list.filter(function(b){
                    var o = DB.users.find(function(u){return u.id === b.ownerId;});
                    var on = o ? o.name : '';
                    var cn = b.category.replace(/-/g,' ');
                    return b.name.toLowerCase().indexOf(s) > -1 || on.toLowerCase().indexOf(s) > -1 || b.location.toLowerCase().indexOf(s) > -1 || cn.indexOf(s) > -1;
                });
            }
            return list;
        }

        function getTotalPages() { return Math.ceil(getFiltered().length / PER_PAGE) || 1; }

        function getStars(r) {
            var h = '<span class="stars">';
            for (var i=1;i<=5;i++) { if (i<=Math.floor(r)) h+='<i class="fas fa-star"></i>'; else if (i-r<1&&i-r>0) h+='<i class="fas fa-star-half-alt"></i>'; else h+='<i class="fas fa-star empty"></i>'; }
            h += '</span><span class="star-rating-text">'+r.toFixed(1)+'</span>';
            return h;
        }

        function getBadge(s) {
            var m = {active:'active',pending:'pending',suspended:'suspended'};
            var c = m[s]||'pending';
            return '<span class="table-badge '+c+'">'+s.charAt(0).toUpperCase()+s.slice(1)+'</span>';
        }

        function getFToggle(b) { return '<button class="featured-toggle '+(b.featured?'on':'off')+'" id="ft-'+b.id+'" onclick="toggleF(\''+b.id+'\')" aria-label="Toggle featured"></button>'; }

        function getActions(b) {
            var id = b.id, h = '<div class="action-btns">';
            if (b.status !== 'active') h += '<button class="action-badge-btn action-badge-green" onclick="approve(\''+id+'\')"><i class="fas fa-check"></i> Approve</button>';
            if (b.status === 'active') h += '<button class="action-badge-btn action-badge-orange" onclick="confirmSuspend(\''+id+'\')"><i class="fas fa-ban"></i> Suspend</button>';
            else h += '<button class="action-badge-btn action-badge-red" onclick="reject(\''+id+'\')"><i class="fas fa-ban"></i> Reject</button>';
            h += '<button class="action-badge-btn action-badge-blue" onclick="edit(\''+id+'\')"><i class="fas fa-pen"></i> Edit</button>';
            h += '<button class="action-badge-btn action-badge-gray" onclick="view(\''+id+'\')"><i class="fas fa-eye"></i></button>';
            h += '<button class="action-badge-btn action-badge-red" onclick="confirmDel(\''+id+'\')"><i class="fas fa-trash"></i></button></div>';
            return h;
        }

        function renderTable() {
            var tb = document.getElementById('tableBody'), pg = document.getElementById('paginationWrap');
            var list = getFiltered(), sliced = list.slice((PAGE-1)*PER_PAGE, (PAGE-1)*PER_PAGE+PER_PAGE), tp = getTotalPages();
            if (list.length === 0) { tb.innerHTML = '<tr><td colspan="9"><div class="empty-state"><i class="fas fa-store"></i><p>No businesses found</p></div></td></tr>'; pg.innerHTML = ''; return; }
            var h = '';
            sliced.forEach(function(b){
                var o = DB.users.find(function(u){return u.id===b.ownerId;}), on = o?o.name:'Unknown';
                var cn = b.category.replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
                var pic = (b.images&&b.images[0]) ? b.images[0] : 'https://ui-avatars.com/api/?name='+encodeURIComponent(b.name.substr(0,2).toUpperCase())+'&background=2563eb&color=fff&size=80';
                h += '<tr>'+
                    '<td><img src="'+pic+'" alt="" class="table-img" onerror="this.src=\'https://ui-avatars.com/api/?name='+encodeURIComponent(b.name.substr(0,2).toUpperCase())+'&background=2563eb&color=fff&size=80\'"></td>'+
                    '<td><div class="table-business-name">'+escapeHtml(b.name)+'</div><div class="table-meta-sm">'+timeAgo(b.dateAdded)+'</div></td>'+
                    '<td>'+escapeHtml(on)+'</td>'+
                    '<td>'+escapeHtml(cn)+'</td>'+
                    '<td>'+escapeHtml(b.location)+'</td>'+
                    '<td>'+getStars(b.rating)+'</td>'+
                    '<td>'+getBadge(b.status)+'</td>'+
                    '<td>'+getFToggle(b)+'</td>'+
                    '<td>'+getActions(b)+'</td></tr>';
            });
            tb.innerHTML = h;
            renderPagination(tp);
            window.scrollTo({top:0,behavior:'smooth'});
        }

        function renderPagination(tp) {
            var w = document.getElementById('paginationWrap');
            if (tp<=1) { w.innerHTML=''; return; }
            var h = '<button onclick="goPage('+(PAGE-1)+')"'+(PAGE<=1?' disabled':'')+'><i class="fas fa-chevron-left"></i></button>';
            var s = Math.max(1,PAGE-2), e = Math.min(s+4,tp);
            if (e-s<4) { s=Math.max(1,tp-4); e=tp; }
            if (s>1) { h+='<button onclick="goPage(1)">1</button>'; if (s>2) h+='<button disabled>...</button>'; }
            for (var i=s;i<=e;i++) h+='<button'+(i===PAGE?' class="active"':'')+' onclick="goPage('+i+')">'+i+'</button>';
            if (e<tp) { if (e<tp-1) h+='<button disabled>...</button>'; h+='<button onclick="goPage('+tp+')">'+tp+'</button>'; }
            h+='<button onclick="goPage('+(PAGE+1)+')"'+(PAGE>=tp?' disabled':'')+'><i class="fas fa-chevron-right"></i></button>';
            w.innerHTML = h;
        }

        function goPage(p) { var t=getTotalPages(); if (p<1||p>t) return; PAGE=p; renderTable(); }

        function toggleF(id) {
            var b = DB.businesses.find(function(x){return x.id===id;}); if (!b) return;
            b.featured = !b.featured;
            showToast1('"'+b.name+'" is now '+(b.featured?'featured':'unfeatured')+'.');
            var btn = document.getElementById('ft-'+id);
            if (btn) { btn.classList.toggle('on'); btn.classList.toggle('off'); }
        }

        function approve(id) {
            var b = DB.businesses.find(function(x){return x.id===id;}); if (!b) return;
            b.status='active'; b.verified=true; renderTable(); showToast1('"'+b.name+'" approved.');
        }

        function confirmSuspend(id) { if (confirm('Suspend this business?')) reject(id); }

        function reject(id) {
            var b = DB.businesses.find(function(x){return x.id===id;}); if (!b) return;
            b.status='suspended'; renderTable(); showToast1('"'+b.name+'" suspended.');
        }

        function confirmDel(id) {
            var b = DB.businesses.find(function(x){return x.id===id;}); if (!b) return;
            if (confirm('Permanently delete "'+b.name+'"? This cannot be undone.')) del(id);
        }

        function del(id) {
            var b = DB.businesses.find(function(x){return x.id===id;}); if (!b) return;
            var n = b.name; DB.businesses = DB.businesses.filter(function(x){return x.id!==id;});
            renderTable(); showToast1('"'+n+'" deleted.');
        }

        function view(id) {
            var b = DB.businesses.find(function(x){return x.id===id;}); if (!b) return;
            var o = DB.users.find(function(u){return u.id===b.ownerId;});
            var on = o ? o.name : 'Unknown';
            var cn = b.category.replace(/-/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
            document.getElementById('dName').textContent = b.name;
            document.getElementById('dOwner').textContent = on;
            document.getElementById('dCategory').textContent = cn;
            document.getElementById('dSubcategory').textContent = b.subcategory||'-';
            document.getElementById('dDescription').textContent = b.description||'-';
            document.getElementById('dLocation').textContent = b.location;
            document.getElementById('dAddress').textContent = b.address||'-';
            document.getElementById('dPhone').textContent = b.phone||'-';
            document.getElementById('dEmail').textContent = b.email||'-';
            document.getElementById('dWebsite').textContent = b.website||'-';
            document.getElementById('dHours').textContent = b.openingHours||'-';
            document.getElementById('dRating').innerHTML = getStars(b.rating)+' ('+b.reviewCount+' reviews)';
            document.getElementById('dDate').textContent = formatDate(b.dateAdded);
            var ie = document.getElementById('dImages'); ie.innerHTML = '';
            if (b.images&&b.images.length) {
                b.images.forEach(function(img){
                    var el = document.createElement('img'); el.src=img; el.alt=b.name; el.loading='lazy';
                    el.onerror=function(){this.src='https://ui-avatars.com/api/?name=X&background=2563eb&color=fff&size=200';};
                    ie.appendChild(el);
                });
            } else { ie.innerHTML = '<span class="detail-value">No images</span>'; }
            var re = document.getElementById('dReviews'), rvs = DB.reviews.filter(function(r){return r.businessId===id;});
            document.getElementById('dReviewCount').textContent = rvs.length;
            re.innerHTML = '';
            if (rvs.length) {
                var rh = '';
                rvs.forEach(function(r){
                    var ru = DB.users.find(function(u){return u.id===r.userId;});
                    var rn = ru ? ru.name : 'Unknown';
                    var rs = ''; for (var s=1;s<=5;s++) rs += s<=r.rating ? '<i class="fas fa-star"></i>' : '<i class="fas fa-star empty"></i>';
                    rh += '<div class="review-item"><strong>'+rn+'</strong> <span class="review-stars">'+rs+'</span>: <span class="detail-value">'+escapeHtml(r.text)+'</span>';
                    if (r.reply) rh += '<div class="review-reply"><strong>Owner Reply</strong>'+escapeHtml(r.reply)+'</div>';
                    rh += '</div>';
                });
                re.innerHTML = rh;
            } else { re.innerHTML = '<span class="detail-value">No reviews yet</span>'; }
            document.getElementById('detailModal').classList.add('open');
        }

        function closeDetailModal() { document.getElementById('detailModal').classList.remove('open'); }

        function edit(id) {
            var b = DB.businesses.find(function(x){return x.id===id;}); if (!b) return;
            editBizId = id;
            document.getElementById('eName').value = b.name;
            document.getElementById('eDescription').value = b.description||'';
            document.getElementById('eSubcategory').value = b.subcategory||'';
            document.getElementById('eStatus').value = b.status;
            document.getElementById('eLocation').value = b.location;
            document.getElementById('eAddress').value = b.address||'';
            document.getElementById('ePhone').value = b.phone||'';
            document.getElementById('eEmail').value = b.email||'';
            var cs = document.getElementById('eCategory'); cs.innerHTML = '';
            if (DB.categories) {
                DB.categories.forEach(function(c){
                    var o = document.createElement('option'); o.value=c.slug; o.text=c.name;
                    if (c.slug===b.category) o.selected=true;
                    cs.appendChild(o);
                });
            }
            document.getElementById('editModal').classList.add('open');
        }

        function closeEditModal() { document.getElementById('editModal').classList.remove('open'); editBizId=null; }

        function saveEditBusiness() {
            if (!editBizId) return;
            var b = DB.businesses.find(function(x){return x.id===editBizId;}); if (!b) return;
            b.name = document.getElementById('eName').value.trim();
            b.description = document.getElementById('eDescription').value.trim();
            b.category = document.getElementById('eCategory').value;
            b.subcategory = document.getElementById('eSubcategory').value.trim();
            b.status = document.getElementById('eStatus').value;
            b.location = document.getElementById('eLocation').value.trim();
            b.address = document.getElementById('eAddress').value.trim();
            b.phone = document.getElementById('ePhone').value.trim();
            b.email = document.getElementById('eEmail').value.trim();
            closeEditModal(); renderTable(); showToast1('"'+b.name+'" updated.');
        }

        document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeDetailModal();closeEditModal();}});
        document.getElementById('detailModal').addEventListener('click',function(e){if(e.target===this)closeDetailModal();});
        document.getElementById('editModal').addEventListener('click',function(e){if(e.target===this)closeEditModal();});

        function formatDate(d) { var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], x=new Date(d); return m[x.getMonth()]+' '+x.getDate()+', '+x.getFullYear(); }

        function timeAgo(d) { var n=new Date(), x=new Date(d), df=Math.floor((n-x)/1000); if (df<60) return 'Just now'; if (df<3600) return Math.floor(df/60)+'m ago'; if (df<86400) return Math.floor(df/3600)+'h ago'; if (df<2592000) return Math.floor(df/86400)+'d ago'; return formatDate(d); }

        function showToast1(m) {
            var e = document.querySelector('.toast-notification'); if (e) e.remove();
            var t = document.createElement('div'); t.className='toast-notification'; t.textContent=m;
            t.style.cssText='position:fixed;bottom:30px;right:30px;background:#1e3a5f;color:#fff;padding:14px 24px;border-radius:12px;z-index:100000;font-size:0.9rem;box-shadow:0 4px 20px rgba(0,0,0,0.25);animation:toastIn 0.3s ease;font-family:Poppins,sans-serif;';
            document.body.appendChild(t);
            setTimeout(function(){t.style.opacity='0';t.style.transition='opacity 0.3s ease';setTimeout(function(){t.remove();},300);},2500);
        }
    </script>
</body>
</html>
