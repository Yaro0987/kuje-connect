<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kuje Connect - Connecting People. Building Communities.</title>
<style>
body{margin:0;background:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif}
.loader{text-align:center}
.spin{width:60px;height:60px;border:5px solid #e2e8f0;border-top-color:#16a34a;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 16px}
@keyframes s{to{transform:rotate(360deg)}}
p{color:#64748b;font-size:.9rem}
</style>
</head>
<body>
<div class="loader">
<div class="spin"></div>
<p>Loading Kuje Connect...</p>
</div>
<script>
fetch('/public/pages/index.html').then(function(r){return r.text()}).then(function(html){document.open();document.write(html);document.close()});
</script>
</body>
</html>
