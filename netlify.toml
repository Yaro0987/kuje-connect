[build]
  publish = "."

# Netlify redirects to replace .htaccess rewrites
# More specific rules come first

# Root → homepage
[[redirects]]
  from = "/"
  to = "/public/pages/index.html"
  status = 200

# Category sub-pages - business/{cat}/{sub} → service/{cat}/{sub}.html
[[redirects]]
  from = "/business/agriculture/:sub"
  to = "/public/pages/service/agriculture/:sub.html"
  status = 200

