# Business detail pages - business/{slug} → business/{slug}.html (fallthrough)
[[redirects]]
  from = "/business/*"
  to = "/public/pages/business/:splat.html"
  status = 200

# User pages
[[redirects]]
  from = "/user/:page"
  to = "/user/:page.html"
  status = 200

# Admin pages
[[redirects]]
  from = "/admin/:page"
  to = "/admin/:page.html"
  status = 200

# Media posts
[[redirects]]
  from = "/media/:slug"
  to = "/public/pages/media-post.html?slug=:slug"
  status = 200

# Other static pages (pricing, about, contact, etc.)
[[redirects]]
  from = "/:page"
  to = "/public/pages/:page.html"
  status = 200

# Netlify headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/public/pages/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
